# Réglages communs à tous les cours. On n'y touche presque jamais.
project:
  type: default
  # Pas de dossier de sortie commun : outils/sorties.py range chaque support dans le _sortie/ de son cours
  post-render: python3 outils/sorties.py
  render:
    - "cours/**/*.qmd"
    - "bac-a-sable/**/*.qmd"

lang: fr
html-math-method: mathml

filters:
  - _briques/gabarit.lua

format:
  revealjs:
    theme: default
    css:
      - _charte/geodata.css
      - _briques/briques.css
      - _briques/briques-carto.css
    include-after-body:
      - _briques/briques.html
      - _briques/briques-carto.html
    logo: _charte/logos/geodata.svg
    width: 1280
    height: 720
    margin: 0
    center: false
    slide-number: c
    menu: false
    transition: none
    controls: false
    hash: true
    auto-stretch: false
    embed-resources: true
    title-slide-attributes:
      data-state: plein
