<script>
/* Briques d'enquête : coupe (mini-jeu de profil), arbre de déduction, observer, indices,
   confiance et calibration, vrai ou IA, bilan des compétences, mode révision.
   Tout reste dans la page ; ce qui est retenu (textes, bilans, révisions) l'est dans le navigateur
   de l'étudiant seulement. */
(function () {
  function tous(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function stopper(el) {
    ["pointerdown", "keydown", "click", "wheel"].forEach(function (n) {
      el.addEventListener(n, function (e) { e.stopPropagation(); });
    });
  }
  function el(nom, classe, parent, texte) {
    var e = document.createElement(nom);
    if (classe) e.className = classe;
    if (texte !== undefined) e.textContent = texte;
    if (parent) parent.appendChild(e);
    return e;
  }
  var SVG = "http://www.w3.org/2000/svg";
  function sv(nom, attrs, parent) {
    var e = document.createElementNS(SVG, nom);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function bouton(texte, classe, parent, action) {
    var b = el("button", "enquete-bouton" + (classe ? " " + classe : ""), parent, texte);
    b.type = "button";
    if (action) b.addEventListener("click", action);
    return b;
  }
  function melanger(liste) {
    for (var i = liste.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = liste[i]; liste[i] = liste[j]; liste[j] = x; }
    return liste;
  }
  var params = new URLSearchParams(window.location.search);
  var EN = (document.documentElement.lang || "fr").slice(0, 2) === "en";
  var EN_PDF = params.has("print-pdf");
  var CORRIGE = EN_PDF && params.get("reponses") !== "non";

  var T = EN ? {
    certitudes: ["Almost certain", "Probable", "Possible", "Unlikely"],
    certitudeAvant: "Before answering, how sure are you?", certitudeDabord: "First say how sure you are.",
    monter: "Up", descendre: "Down", avancer: "Step forward", recommencer: "Start again", jouer: "Click here, then use ↑ ↓ to climb or descend and → to step forward.",
    ecart: function (v) { return "Average gap from the real profile: " + v + " level" + (v === "1.0" ? "" : "s") + "."; },
    bravo: "Very close to the real profile.", proche: "The overall shape is there.", loin: "Look again at the shadows and the slopes.",
    reel: "Real profile", vous: "Your profile",
    retour: "Back one step", chemin: "Your line of reasoning", noeudManquant: "This branch is not written yet.",
    comparer: "Compare with the expert reading", vousAviez: "What you wrote earlier:", rienEcrit: "(nothing written yet)", invite: "Write what you see…",
    indiceSuivant: function (k, n) { return "Next clue (" + k + " / " + n + ")"; }, conclure: "Conclusion", votreCertitude: "Your certainty:",
    trajectoire: "How your certainty moved:",
    reelle: "Real photograph", generee: "AI-generated", suivante: "Next image", juste: "Right.", faux: "Wrong.",
    reponseReelle: "It is a real photograph.", reponseIA: "It was generated by AI.",
    score: function (a, n) { return "Score: " + a + " / " + n + "."; },
    niveaux: ["I don't know", "I think I know", "I know"], competence: "Skill", debut: "At the start", fin: "Now",
    aReprendre: "To work on again:", toutAcquis: "Every skill is marked as known. Check it with the revision mode.",
    calTitre: ["Certainty", "Answers", "Right"], calVide: "Answer the exercises with a certainty bar first: the table will fill in.",
    calLecture: "Well calibrated: the share of right answers falls from “almost certain” to “unlikely”.",
    aRevoir: function (a, n) { return a + " card" + (a > 1 ? "s" : "") + " to review today, out of " + n + "."; },
    commencer: "Start the review", toutReviser: "Practise all the cards", voirReponse: "Show the answer",
    jeSavais: "I knew it", aRevoirCarte: "Review again", fini: "Review done for today. Come back tomorrow, then in a week, then in a month.",
    allerDiapo: "Go to the slide", interactif: "Interactive in the HTML version."
  } : {
    certitudes: ["Presque certain", "Probable", "Possible", "Peu probable"],
    certitudeAvant: "Avant de répondre, quelle est votre certitude ?", certitudeDabord: "Dites d'abord votre certitude.",
    monter: "Monter", descendre: "Descendre", avancer: "Avancer", recommencer: "Recommencer", jouer: "Cliquez ici, puis ↑ ↓ pour monter ou descendre, et → pour avancer.",
    ecart: function (v) { return "Écart moyen au profil réel : " + v.replace(".", ",") + " niveau" + (parseFloat(v) >= 2 ? "x" : "") + "."; },
    bravo: "Très proche du profil réel.", proche: "L'allure générale y est.", loin: "Regardez de nouveau les ombres et les pentes.",
    reel: "Profil réel", vous: "Votre profil",
    retour: "Revenir d'un pas", chemin: "Votre raisonnement", noeudManquant: "Cette branche n'est pas encore écrite.",
    comparer: "Comparer avec la lecture experte", vousAviez: "Ce que vous aviez écrit :", rienEcrit: "(rien d'écrit pour l'instant)", invite: "Écrivez ce que vous voyez…",
    indiceSuivant: function (k, n) { return "Indice suivant (" + k + " / " + n + ")"; }, conclure: "Conclusion", votreCertitude: "Votre certitude :",
    trajectoire: "Votre certitude a évolué ainsi :",
    reelle: "Photo réelle", generee: "Générée par IA", suivante: "Image suivante", juste: "Juste.", faux: "Raté.",
    reponseReelle: "C'est une vraie photographie.", reponseIA: "Elle a été générée par IA.",
    score: function (a, n) { return "Score : " + a + " / " + n + "."; },
    niveaux: ["Je ne sais pas", "Je crois savoir", "Je sais"], competence: "Compétence", debut: "Au début", fin: "Maintenant",
    aReprendre: "À reprendre :", toutAcquis: "Toutes les compétences sont marquées comme sues. Vérifiez-le avec le mode révision.",
    calTitre: ["Certitude", "Réponses", "Justes"], calVide: "Répondez d'abord aux exercices qui ont une barre de certitude : le tableau se remplira.",
    calLecture: "Bien calibré : la part de réponses justes baisse de « presque certain » à « peu probable ».",
    aRevoir: function (a, n) { return a + " carte" + (a > 1 ? "s" : "") + " à revoir aujourd'hui, sur " + n + "."; },
    commencer: "Commencer la révision", toutReviser: "S'entraîner sur toutes les cartes", voirReponse: "Voir la réponse",
    jeSavais: "Je savais", aRevoirCarte: "À revoir", fini: "Révision terminée pour aujourd'hui. Revenez demain, puis dans une semaine, puis dans un mois.",
    allerDiapo: "Aller à la diapo", interactif: "Interactif dans la version HTML."
  };

  // --- Ce que l'on retient, dans le navigateur seulement (rien n'est envoyé) ----------------
  var CLE = "image-intel:" + (document.title || "cours") + ":";
  var memoire = {};
  function lire(k, defaut) {
    try { var v = localStorage.getItem(CLE + k); if (v !== null) return JSON.parse(v); } catch (e) { /* stockage indisponible */ }
    return k in memoire ? memoire[k] : defaut;
  }
  function ecrire(k, v) {
    memoire[k] = v;
    try { localStorage.setItem(CLE + k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ }
  }
  function noterCertitude(id, certitude, juste) {
    var c = lire("calibration", {});
    c[id] = { c: certitude, j: juste };
    ecrire("calibration", c);
  }
  function rangDiapo(noeud) {
    var s = noeud.closest(".slides > section");
    return s ? tous(".reveal .slides > section").indexOf(s) : -1;
  }
  function titreDiapo(section) {
    var t = section.querySelector("h2 .titre-texte") || section.querySelector("h2");
    return t ? t.textContent.trim() : "";
  }
  function allerA(rang) { if (window.Reveal && rang >= 0) window.Reveal.slide(rang); }
  // une barre de quatre certitudes (les mots de probabilité estimative)
  function barreCertitude(parent, quand) {
    var barre = el("div", "certitude-barre", parent);
    el("span", "certitude-titre", barre, T.votreCertitude);
    var boutons = T.certitudes.map(function (nom, k) {
      return bouton(nom, "certitude-choix", barre, function () {
        boutons.forEach(function (b) { b.classList.remove("actif"); });
        boutons[k].classList.add("actif");
        barre.dataset.valeur = k;
        if (quand) quand(k);
      });
    });
    return barre;
  }

  // ------------------------------------------------------------------ coupe : le mini-jeu de profil
  tous(".coupe-zone").forEach(function (zone, numero) {
    stopper(zone);
    var donnees = {};
    try { donnees = JSON.parse(zone.querySelector(".coupe-profil").textContent); } catch (e) { donnees = {}; }
    var points = donnees.points || [[0, 0.5], [1, 0.5]];
    var NIV = 10, pas = parseInt(zone.dataset.pas, 10) || 20;
    var A = zone.dataset.depart.split(",").map(parseFloat), B = zone.dataset.arrivee.split(",").map(parseFloat);
    function reel(t) {          // altitude relative (0 à 1) du profil réel, par interpolation
      for (var i = 1; i < points.length; i++) {
        if (t <= points[i][0]) {
          var a = points[i - 1], b = points[i], f = (t - a[0]) / ((b[0] - a[0]) || 1);
          return a[1] + (b[1] - a[1]) * f;
        }
      }
      return points[points.length - 1][1];
    }
    var cadre = zone.querySelector(".coupe-image");
    var trace = sv("svg", { "class": "coupe-trace", viewBox: "0 0 100 100", preserveAspectRatio: "none" }, cadre);
    sv("line", { x1: A[0], y1: A[1], x2: B[0], y2: B[1], "class": "coupe-ligne" }, trace);
    var repere = el("div", "coupe-repere", cadre);
    ["A", "B"].forEach(function (nom, k) {
      var p = el("div", "coupe-extremite", cadre, nom);
      var q = k ? B : A; p.style.left = q[0] + "%"; p.style.top = q[1] + "%";
    });
    var jeu = zone.querySelector(".coupe-jeu");
    var W = 1000, H = 230, G = 40;
    var graphe = sv("svg", { "class": "coupe-graphe", viewBox: "0 0 " + W + " " + H }, jeu);
    function X(k) { return G + (W - 2 * G) * k / pas; }
    function Y(n) { return H - 24 - (H - 48) * n / NIV; }
    for (var n = 0; n <= NIV; n++) sv("line", { x1: G, x2: W - G, y1: Y(n), y2: Y(n), "class": n % 5 ? "coupe-grille" : "coupe-grille forte" }, graphe);
    var texteA = sv("text", { x: G - 14, y: H - 6, "class": "coupe-lettre" }, graphe); texteA.textContent = "A";
    var texteB = sv("text", { x: W - G + 4, y: H - 6, "class": "coupe-lettre" }, graphe); texteB.textContent = "B";
    var courbeReelle = sv("path", { "class": "coupe-reelle" }, graphe);
    var chemin = sv("polyline", { "class": "coupe-vous" }, graphe);
    var marcheur = sv("g", { "class": "coupe-marcheur" }, graphe);
    sv("circle", { cx: 0, cy: -26, r: 7 }, marcheur);
    sv("path", { d: "M0 -19 V-6 M0 -6 L-7 6 M0 -6 L7 6 M-8 -14 L8 -14" }, marcheur);
    var pied = el("div", "coupe-pied", jeu);
    var aide = el("div", "coupe-aide", pied, T.jouer);
    var commandes = el("div", "coupe-commandes", pied);
    var message = el("div", "coupe-message", jeu);
    var apres = tous(".apres-jeu", zone.parentNode);
    var niveaux, k, niveau;
    function dessiner() {
      var pts = niveaux.map(function (v, i) { return X(i) + "," + Y(v); });
      if (k <= pas) pts.push(X(k) + "," + Y(niveau));
      chemin.setAttribute("points", pts.join(" "));
      marcheur.setAttribute("transform", "translate(" + X(Math.min(k, pas)) + "," + Y(niveau) + ")");
      var t = Math.min(k, pas) / pas;
      repere.style.left = (A[0] + (B[0] - A[0]) * t) + "%";
      repere.style.top = (A[1] + (B[1] - A[1]) * t) + "%";
    }
    function montrerReel() {
      var d = "";
      for (var i = 0; i <= 100; i++) d += (i ? " L" : "M") + (G + (W - 2 * G) * i / 100).toFixed(1) + " " + Y(reel(i / 100) * NIV).toFixed(1);
      courbeReelle.setAttribute("d", d);
      zone.classList.add("termine");
      apres.forEach(function (a) { a.classList.add("visible"); });
    }
    function terminer() {
      montrerReel();
      var somme = 0;
      niveaux.forEach(function (v, i) { somme += Math.abs(v - reel(i / pas) * NIV); });
      var e = somme / niveaux.length;
      message.textContent = T.ecart(e.toFixed(1)) + " " + (e < 1.2 ? T.bravo : e < 2.5 ? T.proche : T.loin);
    }
    function avancer() {
      if (k > pas) return;
      niveaux.push(niveau); k += 1;
      if (k > pas) { dessiner(); terminer(); } else dessiner();
    }
    function bouger(d) { if (k <= pas) { niveau = Math.max(0, Math.min(NIV, niveau + d)); dessiner(); } }
    function depart() {
      niveaux = []; k = 0; niveau = Math.round(reel(0) * NIV);
      courbeReelle.setAttribute("d", ""); message.textContent = "";
      zone.classList.remove("termine");
      apres.forEach(function (a) { a.classList.remove("visible"); });
      dessiner();
    }
    bouton("↑ " + T.monter, "", commandes, function () { bouger(1); zone.focus(); });
    bouton("↓ " + T.descendre, "", commandes, function () { bouger(-1); zone.focus(); });
    bouton("→ " + T.avancer, "principal", commandes, function () { avancer(); zone.focus(); });
    bouton(T.recommencer, "discret", commandes, function () { depart(); zone.focus(); });
    zone.addEventListener("keydown", function (e) {
      var fait = true;
      if (e.key === "ArrowUp") bouger(1);
      else if (e.key === "ArrowDown") bouger(-1);
      else if (e.key === "ArrowRight" || e.key === " ") avancer();
      else fait = false;
      if (fait) e.preventDefault();
    });
    zone.addEventListener("click", function () { zone.focus(); });
    depart();
    if (CORRIGE) { niveaux = []; k = pas + 1; dessiner(); montrerReel(); chemin.setAttribute("points", ""); }
  });

  // ------------------------------------------------------------------ arbre de déduction
  tous(".arbre-zone").forEach(function (zone) {
    stopper(zone);
    var noeuds = {}, ordre = [];
    try { JSON.parse(zone.querySelector(".arbre-donnees").textContent).forEach(function (n) { noeuds[n.id] = n; ordre.push(n.id); }); } catch (e) { /* vide */ }
    if (!ordre.length) return;
    var cheminBloc = zone.querySelector(".arbre-chemin"), noeudBloc = zone.querySelector(".arbre-noeud");
    var pile = [];
    function afficher() {
      var id = pile.length ? pile[pile.length - 1].v : ordre[0];
      cheminBloc.innerHTML = "";
      if (pile.length) {
        el("div", "arbre-titre", cheminBloc, T.chemin);
        var ol = el("ol", "", cheminBloc);
        pile.forEach(function (p) {
          var li = el("li", "", ol);
          el("span", "arbre-q", li, p.q + " ");
          el("strong", "", li, p.t);
        });
      }
      noeudBloc.innerHTML = "";
      var n = noeuds[id];
      if (!n) { el("p", "arbre-manquant", noeudBloc, T.noeudManquant); }
      else if (n.fin) {
        noeudBloc.classList.add("conclusion");
        el("div", "arbre-titre", noeudBloc, T.conclure);
        el("p", "arbre-question", noeudBloc, n.q);
        var corps = el("div", "arbre-corps", noeudBloc); corps.innerHTML = n.corps;
      } else {
        noeudBloc.classList.remove("conclusion");
        el("p", "arbre-question", noeudBloc, n.q);
        var choix = el("div", "arbre-choix", noeudBloc);
        n.choix.forEach(function (c) {
          bouton(c.t, "", choix, function () { pile.push({ q: n.q, t: c.t, v: c.v }); afficher(); });
        });
      }
      var pied = el("div", "arbre-pied", noeudBloc);
      if (pile.length) {
        bouton(T.retour, "discret", pied, function () { pile.pop(); afficher(); });
        bouton(T.recommencer, "discret", pied, function () { pile = []; afficher(); });
      }
    }
    if (CORRIGE) {             // le PDF déroule tout l'arbre, nœud par nœud
      noeudBloc.innerHTML = "";
      ordre.forEach(function (id) {
        var n = noeuds[id], b = el("div", "arbre-imprime" + (n.fin ? " conclusion" : ""), noeudBloc);
        el("strong", "", b, (n.fin ? "→ " : "") + n.q);
        if (!n.fin) el("div", "arbre-options", b, n.choix.map(function (c) { return c.t; }).join("  ·  "));
        else { var corps = el("div", "arbre-corps", b); corps.innerHTML = n.corps; }
      });
      return;
    }
    afficher();
  });

  // ------------------------------------------------------------------ observer : écrire, puis comparer
  tous(".observer-zone").forEach(function (zone) {
    var bloc = zone.parentNode;
    stopper(bloc);
    var expert = bloc.querySelector(".observer-expert");
    if (zone.dataset.rappel) {
      var r = el("div", "observer-rappel", zone);
      el("div", "observer-titre", r, T.vousAviez);
      var p = el("p", "", r);
      var relire = function () {
        var texte = lire("observer:" + zone.dataset.rappel, "");
        p.className = texte ? "" : "observer-vide"; p.textContent = texte || T.rienEcrit;
      };
      relire();
      if (window.Reveal) window.Reveal.on("slidechanged", function (e) { if (e.currentSlide.contains(zone)) relire(); });
    }
    var champ = el("textarea", "observer-champ", zone);
    champ.rows = 4;
    champ.placeholder = zone.dataset.invite || T.invite;
    var cle = zone.dataset.cle;
    if (cle) champ.value = lire("observer:" + cle, "");
    champ.addEventListener("input", function () { if (cle) ecrire("observer:" + cle, champ.value); });
    if (expert && expert.textContent.trim()) {
      bouton(T.comparer, "principal", zone, function () { bloc.classList.add("montre"); });
    }
    if (CORRIGE) bloc.classList.add("montre");
  });

  // ------------------------------------------------------------------ indices : l'image se dévoile
  tous(".indices-zone").forEach(function (zone, numero) {
    stopper(zone);
    var liste = [];
    try { liste = JSON.parse(zone.querySelector(".indices-donnees").textContent); } catch (e) { liste = []; }
    var image = zone.querySelector(".indices-image"), ol = zone.querySelector(".indices-liste");
    var commandes = zone.querySelector(".indices-commandes");
    var conclusion = zone.parentNode.querySelector(".indices-conclusion");
    var avecCertitude = zone.dataset.confiance === "oui";
    var k = 0, trajectoire = [];
    var suite = bouton("", "principal", commandes, montrer);
    var resume = el("div", "indices-resume", commandes);
    function cadre(z, n) {
      var c = el("div", "indices-cadre", image);
      c.style.left = z[0] + "%"; c.style.top = z[1] + "%"; c.style.width = z[2] + "%"; c.style.height = z[3] + "%";
      el("span", "", c, String(n));
    }
    function montrer() {
      if (k >= liste.length) return;
      var d = liste[k], li = el("li", "", ol);
      el("span", "", li, d.t);
      if (d.z) cadre(d.z, k + 1);
      if (avecCertitude && !CORRIGE) {
        var rang = k;
        barreCertitude(li, function (v) { trajectoire[rang] = v; majResume(); });
      }
      k += 1;
      maj();
    }
    function majResume() {
      if (!avecCertitude || k < liste.length) return;
      var mots = trajectoire.filter(function (v) { return v !== undefined; }).map(function (v) { return T.certitudes[v]; });
      resume.textContent = mots.length ? T.trajectoire + " " + mots.join(" → ") : "";
    }
    function maj() {
      if (k < liste.length) suite.textContent = T.indiceSuivant(k + 1, liste.length);
      else { suite.style.display = "none"; if (conclusion) conclusion.classList.add("visible"); majResume(); }
    }
    maj();
    if (CORRIGE) while (k < liste.length) montrer();
  });

  // ------------------------------------------------------------------ confiance : la certitude avant le choix
  tous(".confiance").forEach(function (bloc, numero) {
    var place = bloc.querySelector(".confiance-barre");
    if (!place) return;
    if (EN_PDF) { place.remove(); return; }
    el("div", "certitude-avant", place, T.certitudeAvant);
    var barre = barreCertitude(place);
    var alerte = el("div", "certitude-alerte", place);
    var id = "q" + rangDiapo(bloc) + "-" + numero;
    tous(".choix", bloc).forEach(function (choix) {
      // en capture : on arrête le clic tant que la certitude n'est pas dite
      choix.addEventListener("click", function (e) {
        if (barre.dataset.valeur === undefined) {
          e.stopImmediatePropagation(); e.preventDefault();
          alerte.textContent = T.certitudeDabord;
          return;
        }
        alerte.textContent = "";
        noterCertitude(id, +barre.dataset.valeur, choix.dataset.juste === "oui");
      }, true);
    });
  });

  // ------------------------------------------------------------------ vrai ou IA
  tous(".vraiia-zone").forEach(function (zone, numero) {
    stopper(zone);
    var cartes = [];
    try { cartes = JSON.parse(zone.querySelector(".vraiia-donnees").textContent); } catch (e) { cartes = []; }
    var sources = tous(".vraiia-source", zone);
    cartes.forEach(function (c, i) { var s = sources[i]; if (s) c.src = s.getAttribute("src"); });
    if (CORRIGE) {
      var grille = el("div", "vraiia-grille", zone);
      cartes.forEach(function (c) {
        var f = el("figure", "vraiia-vignette " + c.nature, grille);
        var img = el("img", "", f); img.src = c.src; img.alt = c.legende;
        var cap = el("figcaption", "", f);
        el("strong", "", cap, (c.nature === "ia" ? T.generee : T.reelle) + ". ");
        el("span", "", cap, c.e);
      });
      return;
    }
    var k = 0, bonnes = 0;
    var scene = el("div", "vraiia-scene", zone);
    var vue = el("div", "vraiia-image", scene);
    var cote = el("div", "vraiia-cote", scene);
    function afficher() {
      vue.innerHTML = ""; cote.innerHTML = "";
      if (k >= cartes.length) {
        el("p", "vraiia-score", cote, T.score(bonnes, cartes.length));
        bouton(T.recommencer, "discret", cote, function () { k = 0; bonnes = 0; afficher(); });
        return;
      }
      var c = cartes[k];
      var img = el("img", "", vue); img.src = c.src; img.alt = "";
      el("div", "vraiia-compte", cote, (k + 1) + " / " + cartes.length);
      var barre = barreCertitude(cote);
      var alerte = el("div", "certitude-alerte", cote);
      var choix = el("div", "vraiia-choix", cote);
      function repondre(nature) {
        if (barre.dataset.valeur === undefined) { alerte.textContent = T.certitudeDabord; return; }
        var juste = nature === c.nature;
        if (juste) bonnes += 1;
        noterCertitude("ia" + rangDiapo(zone) + "-" + k, +barre.dataset.valeur, juste);
        choix.innerHTML = ""; alerte.textContent = "";
        var v = el("div", "vraiia-verdict " + (juste ? "juste" : "faux"), cote);
        el("strong", "", v, (juste ? T.juste : T.faux) + " " + (c.nature === "ia" ? T.reponseIA : T.reponseReelle));
        if (c.legende) el("div", "vraiia-legende", v, c.legende);
        if (c.e) el("p", "", v, c.e);
        bouton(T.suivante, "principal", cote, function () { k += 1; afficher(); });
      }
      bouton(T.reelle, "", choix, function () { repondre("vrai"); });
      bouton(T.generee, "", choix, function () { repondre("ia"); });
    }
    afficher();
  });

  // ------------------------------------------------------------------ calibration
  function tableCalibration(zone) {
    zone.innerHTML = "";
    var c = lire("calibration", {}), par = T.certitudes.map(function () { return { n: 0, j: 0 }; });
    Object.keys(c).forEach(function (id) { var e = c[id]; if (par[e.c]) { par[e.c].n += 1; if (e.j) par[e.c].j += 1; } });
    var total = par.reduce(function (s, p) { return s + p.n; }, 0);
    if (!total) { el("p", "calibration-vide", zone, EN_PDF ? T.interactif : T.calVide); return; }
    var table = el("table", "calibration-table", zone), tr = el("tr", "", el("thead", "", table));
    T.calTitre.forEach(function (t) { el("th", "", tr, t); });
    var corps = el("tbody", "", table);
    par.forEach(function (p, i) {
      var l = el("tr", "", corps);
      el("td", "", l, T.certitudes[i]); el("td", "", l, String(p.n));
      var td = el("td", "", l);
      if (p.n) {
        var pc = Math.round(100 * p.j / p.n);
        var barre = el("span", "calibration-barre", td); barre.style.width = pc + "%";
        el("span", "calibration-pc", td, pc + " %");
      } else td.textContent = "–";
    });
    el("p", "calibration-lecture", zone, T.calLecture);
  }
  tous(".calibration-zone").forEach(function (zone) {
    tableCalibration(zone);
    if (window.Reveal) window.Reveal.on("slidechanged", function (e) { if (e.currentSlide.contains(zone)) tableCalibration(zone); });
  });

  // ------------------------------------------------------------------ bilan des compétences
  tous(".bilan-zone").forEach(function (zone) {
    stopper(zone);
    var comps = [];
    try { comps = JSON.parse(zone.querySelector(".bilan-donnees").textContent); } catch (e) { comps = []; }
    var moment = zone.dataset.moment === "fin" ? "fin" : "debut";
    function dessiner() {
      tous(".bilan-table, .bilan-reprendre", zone).forEach(function (e) { e.remove(); });
      var choixDebut = lire("bilan-debut", {}), choix = lire("bilan-" + moment, {});
      var table = el("table", "bilan-table", zone), tr = el("tr", "", el("thead", "", table));
      el("th", "", tr, T.competence);
      if (moment === "fin") el("th", "", tr, T.debut);
      el("th", "", tr, moment === "fin" ? T.fin : "");
      var corps = el("tbody", "", table);
      comps.forEach(function (c) {
        var l = el("tr", "", corps);
        var td = el("td", "bilan-nom", l); el("strong", "", td, c.c + " "); el("span", "", td, c.t);
        if (moment === "fin") el("td", "bilan-avant", l, choixDebut[c.c] !== undefined ? T.niveaux[choixDebut[c.c]] : "–");
        var cases = el("td", "bilan-cases", l);
        T.niveaux.forEach(function (nom, v) {
          var b = bouton(nom, "bilan-choix" + (choix[c.c] === v ? " actif" : ""), cases, function () {
            var tout = lire("bilan-" + moment, {}); tout[c.c] = v; ecrire("bilan-" + moment, tout); dessiner();
          });
          b.dataset.niveau = v;
        });
      });
      if (moment === "fin") {
        var fragiles = comps.filter(function (c) { return choix[c.c] !== undefined && choix[c.c] < 2; });
        var r = el("div", "bilan-reprendre", zone);
        if (!Object.keys(choix).length) return;
        if (!fragiles.length) { el("p", "", r, T.toutAcquis); return; }
        el("div", "bilan-titre", r, T.aReprendre);
        fragiles.forEach(function (c) {
          var ligne = el("div", "bilan-ligne", r);
          el("strong", "", ligne, c.c + " ");
          tous('.reveal .slides > section.socle[data-competences~="' + c.c + '"]').forEach(function (s) {
            var rang = tous(".reveal .slides > section").indexOf(s);
            var lien = el("a", "bilan-lien", ligne, titreDiapo(s) || String(rang + 1));
            lien.href = "#"; lien.addEventListener("click", function (e) { e.preventDefault(); allerA(rang); });
          });
        });
      }
    }
    dessiner();
    if (window.Reveal) window.Reveal.on("slidechanged", function (e) { if (e.currentSlide.contains(zone)) dessiner(); });
  });

  // ------------------------------------------------------------------ mode révision (boîtes de Leitner)
  var JOUR = 24 * 3600 * 1000, DELAIS = [0, JOUR, 7 * JOUR, 30 * JOUR];
  function cartesDuCours() {
    var cartes = [];
    tous(".reveal .slides > section").forEach(function (s, rang) {
      if (s.querySelector(".revision-zone")) return;
      var titre = titreDiapo(s);
      var questions = tous(".question", s), reponses = tous(".reponse", s);
      questions.forEach(function (q, i) {
        var r = reponses[i]; if (!r) return;
        cartes.push({ id: "d" + rang + "q" + i, rang: rang, titre: titre, q: sansEtiquette(q), r: sansEtiquette(r) });
      });
      tous(".qcm", s).forEach(function (bloc, i) {
        var enonce = tous(":scope > p", bloc).map(function (p) { return p.outerHTML; }).join("");
        var bonnes = tous('.choix[data-juste="oui"]', bloc).map(function (c) { return c.innerHTML; }).join("");
        var options = tous(".choix .choix-texte", bloc).map(function (c) { return "<li>" + c.innerHTML + "</li>"; }).join("");
        cartes.push({ id: "d" + rang + "m" + i, rang: rang, titre: titre, q: enonce + "<ul>" + options + "</ul>", r: bonnes });
      });
    });
    return cartes;
  }
  function sansEtiquette(noeud) {
    var c = noeud.cloneNode(true);
    tous(".etiquette", c).forEach(function (e) { e.remove(); });
    return c.innerHTML;
  }
  tous(".revision-zone").forEach(function (zone) {
    stopper(zone);
    if (EN_PDF) { el("p", "revision-pdf", zone, T.interactif); return; }
    var toutes = null;
    function etat() { return lire("leitner", {}); }
    function dues() {
      var e = etat(), maintenant = Date.now();
      return toutes.filter(function (c) { var x = e[c.id]; return !x || x.prochaine <= maintenant; });
    }
    function accueil() {
      if (!toutes) toutes = cartesDuCours();
      zone.innerHTML = "";
      var d = dues();
      el("p", "revision-compte", zone, T.aRevoir(d.length, toutes.length));
      var b = el("div", "revision-boutons", zone);
      if (d.length) bouton(T.commencer, "principal", b, function () { serie(melanger(d.slice())); });
      bouton(T.toutReviser, "", b, function () { serie(melanger(toutes.slice()), true); });
    }
    function serie(liste, entrainement) {
      var k = 0;
      function carte() {
        zone.innerHTML = "";
        if (k >= liste.length) { el("p", "revision-fini", zone, T.fini); bouton(T.recommencer, "discret", zone, accueil); return; }
        var c = liste[k];
        var tete = el("div", "revision-tete", zone);
        el("span", "revision-compte", tete, (k + 1) + " / " + liste.length + " · " + c.titre);
        var aller = el("a", "revision-aller", tete, T.allerDiapo); aller.href = "#";
        aller.addEventListener("click", function (e) { e.preventDefault(); allerA(c.rang); });
        var q = el("div", "revision-question", zone); q.innerHTML = c.q;
        var r = el("div", "revision-reponse", zone); r.innerHTML = c.r;
        var b = el("div", "revision-boutons", zone);
        bouton(T.voirReponse, "principal", b, function () {
          r.classList.add("visible"); b.innerHTML = "";
          bouton(T.jeSavais, "principal", b, function () { noter(c, true); });
          bouton(T.aRevoirCarte, "", b, function () { noter(c, false); });
        });
      }
      function noter(c, su) {
        if (!entrainement || true) {
          var e = etat(), x = e[c.id] || { boite: 0 };
          x.boite = su ? Math.min(3, x.boite + 1) : 0;
          x.prochaine = Date.now() + DELAIS[x.boite];
          e[c.id] = x; ecrire("leitner", e);
        }
        if (!su && !entrainement) liste.push(c);       // une carte manquée revient dans la même séance
        k += 1; carte();
      }
      carte();
    }
    accueil();
    if (window.Reveal) window.Reveal.on("slidechanged", function (e) { if (e.currentSlide.contains(zone)) accueil(); });
  });
  // ?revision dans l'adresse : on ouvre directement la diapo de révision
  if (params.has("revision") && window.Reveal) {
    window.Reveal.on("ready", function () {
      var z = document.querySelector(".revision-zone");
      if (z) allerA(rangDiapo(z));
    });
  }
})();
</script>
