<script>
/* Briques d'application (cours « Image Application ») :
   vote (oui / non / pas sûr), compromis (les quatre résolutions), atelier des commandes
   (hexagones, personnages, correction, cas réel, envoi), chaîne de référence, pépites, envoi.
   Ce qui est fait est gardé dans le navigateur ; l'envoi vers la feuille de calcul est volontaire. */
(function () {
  function tous(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function stopper(e_) {
    ["pointerdown", "keydown", "click", "wheel", "dragstart", "touchstart"].forEach(function (n) {
      e_.addEventListener(n, function (e) { e.stopPropagation(); });
    });
  }
  function el(nom, classe, parent, texte) {
    var e = document.createElement(nom);
    if (classe) e.className = classe;
    if (texte !== undefined) e.textContent = texte;
    if (parent) parent.appendChild(e);
    return e;
  }
  function bouton(texte, classe, parent, action) {
    var b = el("button", "hx-bouton" + (classe ? " " + classe : ""), parent, texte);
    b.type = "button";
    if (action) b.addEventListener("click", action);
    return b;
  }
  var params = new URLSearchParams(window.location.search);
  var EN = (document.documentElement.lang || "fr").slice(0, 2) === "en";
  var EN_PDF = params.has("print-pdf");
  var CORRIGE = EN_PDF && params.get("reponses") !== "non";
  // typographie française : espace insécable devant : ; ! ? et à l'intérieur des guillemets
  function ty(s) {
    if (EN || !s) return s || "";
    return String(s).replace(/ ([:;!?»])/g, " $1").replace(/« /g, "« ");
  }

  var T = EN ? {
    oui: "Yes", non: "No", pasSur: "Not sure", suivant: "Next", recommencer: "Start again",
    possible: "Possible.", impossible: "Not possible (or not yet).", sondage: "Noted.",
    juste: "Right", rate: "Wrong", doute: "You were not sure",
    bilanVote: function (j, f, d, n) { return j + " right, " + f + " wrong, " + d + " not sure, out of " + n + "."; },
    question: "Can it be done from the sky?",
    axes: ["Spatial", "Temporal", "Spectral", "Radiometric"],
    axesCourts: ["spatial", "temporal", "spectral", "radiometric"],
    objectif: "Goal", atteint: "Goal reached.", pasAtteint: "Not yet.",
    ressemble: "Your sensor looks like:", bloque: "Every other setting is at its minimum: a single sensor cannot have it all.",
    impossibleObj: "This goal cannot be reached by a single sensor: that is why sensors are combined (constellations, fusion).",
    plus: "more", moins: "less", raz: "Back to zero",
    groupe: "Group", noms: "Names (optional)", commande: "Order", chaine: "The chain", casReel: "The real case", envoyer: "Send",
    valider: "Check my chain", effacer: "Clear the board", reserve: "Your hexagons", nouveau: "new",
    choisirHex: "Pick a hexagon, then click an empty cell. Click a placed hexagon to move it; click it twice to take it back.",
    infoVide: "Point at a hexagon to read what it is.",
    aRetenir: "What it is: ", permet: "What it allows: ",
    parler: "Talk to", fermer: "Close", debloque: "New in your reserve: ", pepite: "Nugget",
    correction: "Feedback", indispensable: "Essential", acceptable: "Acceptable", piege: "Trap", hors: "Off-topic here",
    isole: "This hexagon rests on no earlier step.", sansValider: "Rose: “Nobody checked your result. Who would trust it?”",
    sansResultat: "What do you hand over to the client? A Result hexagon is missing.",
    sansVerbe: "What does the client want? A Verb hexagon is missing.",
    score: function (a, n) { return a + " / " + n + " essential steps present."; },
    manque: "Missing", pieges: "Traps", reference: "Show the reference chain", voirSolution: "Go to the solution",
    horsDefaut: "Ask yourself what this brings to the order.",
    retourReserve: "Back to the reserve", vide: "Place some hexagons first.",
    casTitre: "Find a real case that matches your order, then fill in this record.",
    champs: [["titre", "The real case (title, organisation, year)"], ["lien", "Link to the source"], ["signal", "Signal used"],
      ["donnee", "Data actually used"], ["traitements", "Processing performed"], ["sensibilite", "Sensitivity to external factors"],
      ["ecarts", "Differences between your chain and the real case"]],
    resolutions: "Its four resolutions", moyens: "Means", moyensListe: ["Choose…", "One person", "Small team", "Large team", "Institution (a few hundred)", "Even more"],
    precision: "Can the accuracy be estimated?", precisionListe: ["Choose…", "Yes, quantified", "Partly", "No", "Unknown"],
    envoiTitre: "Send your work", envoiAide: "Sending puts your group, your chain, its feedback, your real-case record and your votes in the course spreadsheet.",
    envoiBouton: "Send to the spreadsheet", telecharger: "Download the record (JSON)", copier: "Copy as text",
    envoiFait: "Sent. The spreadsheet does not confirm receipt: check with your teacher.", envoiErreur: "Sending failed: download the record instead.",
    envoiAbsent: "The sending address is not set yet: download the record and hand it in.", copie: "Copied.",
    groupeManque: "Enter your group number first.",
    pepitesCompte: function (a, n) { return a + " / " + n + " nuggets heard during the workshop."; },
    pepiteEntendue: "heard", interactif: "Interactive in the HTML version.",
    commandesPdf: "The eight orders"
  } : {
    oui: "Oui", non: "Non", pasSur: "Pas sûr", suivant: "Suivant", recommencer: "Recommencer",
    possible: "C'est possible.", impossible: "Ce n'est pas possible (ou pas encore).", sondage: "C'est noté.",
    juste: "Juste", rate: "Raté", doute: "Vous n'étiez pas sûr",
    bilanVote: function (j, f, d, n) { return j + " juste" + (j > 1 ? "s" : "") + ", " + f + " raté" + (f > 1 ? "s" : "") + ", " + d + " « pas sûr », sur " + n + "."; },
    question: "Peut-on le faire depuis le ciel ?",
    axes: ["Spatiale", "Temporelle", "Spectrale", "Radiométrique"],
    axesCourts: ["spatiale", "temporelle", "spectrale", "radiométrique"],
    objectif: "Objectif", atteint: "Objectif atteint.", pasAtteint: "Pas encore.",
    ressemble: "Votre capteur ressemble à :", bloque: "Tous les autres réglages sont au minimum : un seul capteur ne peut pas tout avoir.",
    impossibleObj: "Aucun capteur seul n'atteint cet objectif : c'est pour cela qu'on combine des capteurs (constellations, fusion).",
    plus: "plus", moins: "moins", raz: "Remettre à zéro",
    groupe: "Groupe", noms: "Noms (facultatif)", commande: "Commande", chaine: "La chaîne", casReel: "Le cas réel", envoyer: "Envoyer",
    valider: "Valider ma chaîne", effacer: "Vider le plateau", reserve: "Vos hexagones", nouveau: "nouveau",
    choisirHex: "Choisissez un hexagone, puis cliquez une case vide. Cliquez un hexagone posé pour le déplacer ; deux fois pour le reprendre.",
    infoVide: "Survolez un hexagone pour lire ce qu'il est.",
    aRetenir: "Ce que c'est : ", permet: "Ce que ça permet : ",
    parler: "Parler à", fermer: "Fermer", debloque: "Nouveau dans votre réserve : ", pepite: "Pépite",
    correction: "Correction", indispensable: "Indispensable", acceptable: "Acceptable", piege: "Piège", hors: "Hors sujet ici",
    isole: "Cet hexagone ne s'appuie sur aucune étape précédente.", sansValider: "Rose : « Personne n'a vérifié votre résultat. Qui le croira ? »",
    sansResultat: "Que remettez-vous au client ? Il manque un hexagone Résultat.",
    sansVerbe: "Que veut le client ? Il manque un hexagone Verbe.",
    score: function (a, n) { return a + " / " + n + " étapes indispensables présentes."; },
    manque: "Ce qui manque", pieges: "Les pièges", reference: "Voir la chaîne de référence", voirSolution: "Aller à la solution",
    horsDefaut: "Demandez-vous ce qu'il apporte à la commande.",
    retourReserve: "Revenir à la réserve", vide: "Posez d'abord des hexagones.",
    casTitre: "Trouvez un cas réel qui ressemble à votre commande, puis remplissez cette fiche.",
    champs: [["titre", "Le cas réel (titre, organisme, année)"], ["lien", "Lien vers la source"], ["signal", "Signal utilisé"],
      ["donnee", "Données réellement utilisées"], ["traitements", "Traitements effectués"], ["sensibilite", "Sensibilité à des paramètres extérieurs"],
      ["ecarts", "Écarts entre votre chaîne et le cas réel"]],
    resolutions: "Ses quatre résolutions", moyens: "Moyens", moyensListe: ["Choisir…", "Une personne", "Petite équipe", "Grosse équipe", "Institution (quelques centaines)", "Plus encore"],
    precision: "Peut-on estimer la précision ?", precisionListe: ["Choisir…", "Oui, chiffrée", "En partie", "Non", "Inconnu"],
    envoiTitre: "Envoyer votre travail", envoiAide: "L'envoi range dans la feuille du cours votre groupe, votre chaîne et sa correction, la fiche du cas réel et vos votes.",
    envoiBouton: "Envoyer vers la feuille", telecharger: "Télécharger la fiche (JSON)", copier: "Copier en texte",
    envoiFait: "Envoyé. La feuille ne renvoie pas d'accusé de réception : vérifiez avec l'enseignant.", envoiErreur: "L'envoi a échoué : téléchargez la fiche.",
    envoiAbsent: "L'adresse d'envoi n'est pas encore réglée : téléchargez la fiche et remettez-la.", copie: "Copié.",
    groupeManque: "Indiquez d'abord votre numéro de groupe.",
    pepitesCompte: function (a, n) { return a + " / " + n + " pépites entendues pendant l'atelier."; },
    pepiteEntendue: "entendue", interactif: "Interactif dans la version HTML.",
    commandesPdf: "Les huit commandes"
  };

  // --- Mémoire, dans le navigateur seulement ------------------------------------------------
  var CLE = "image-app:" + (document.title || "cours") + ":";
  var memoire = {};
  function lire(k, defaut) {
    try { var v = localStorage.getItem(CLE + k); if (v !== null) return JSON.parse(v); } catch (e) { /* stockage indisponible */ }
    return k in memoire ? memoire[k] : defaut;
  }
  function ecrire(k, v) {
    memoire[k] = v;
    try { localStorage.setItem(CLE + k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ }
  }

  // --- Les données de l'atelier, embarquées une fois ---------------------------------------
  var cache = {};
  function donnees(source) {
    if (cache[source]) return cache[source];
    var s = tous(".hx-donnees").filter(function (n) { return n.dataset.source === source; })[0] || document.querySelector(".hx-donnees");
    var d = null;
    try { d = JSON.parse(s.textContent); } catch (e) { d = null; }
    if (!d) return null;
    d.hex = {}; d.hexagones.forEach(function (h) { d.hex[h.id] = h; });
    d.fam = {}; d.familles.forEach(function (f) { d.fam[f.id] = f; });
    d.cmd = {}; d.commandes.forEach(function (c) { d.cmd[c.id] = c; });
    d.pep = {}; d.pepites.forEach(function (p) { d.pep[p.id] = p; });
    cache[source] = d;
    return d;
  }
  // un hexagone dessiné en HTML (deux couches : le filet et le fond)
  function hexa(d, id, classe, parent) {
    var h = d.hex[id], f = h ? d.fam[h.famille] : null;
    var boite = el("div", "hx-hex" + (classe ? " " + classe : ""), parent);
    boite.dataset.id = id;
    var fond = el("div", "hx-hex-fond", boite);
    if (f) { fond.style.background = f.fond; fond.style.color = f.texte; }
    el("span", "hx-hex-texte", fond, h ? ty(h.court) : id);
    return boite;
  }

  // =====================================================================================
  // VOTE : oui, non, pas sûr
  // =====================================================================================
  tous(".vote-zone").forEach(function (zone, numero) {
    stopper(zone);
    var items = [];
    try { items = JSON.parse(zone.querySelector(".vote-donnees").textContent); } catch (e) { items = []; }
    if (!items.length) return;
    var cle = "vote:" + numero;
    var rep = lire(cle, {});
    var question = zone.dataset.question || T.question;
    if (CORRIGE) {
      var ul = el("ol", "vote-imprime", zone);
      items.forEach(function (it) {
        var li = el("li", "", ul);
        el("strong", "", li, ty(it.t));
        if (it.n !== "sondage") el("span", "vote-verdict " + it.n, li, " " + (it.n === "vrai" ? T.possible : T.impossible) + " ");
        if (it.e) el("span", "", li, ty(it.e));
      });
      return;
    }
    var tete = el("div", "vote-tete", zone);
    var compte = el("span", "vote-compte", tete);
    el("span", "vote-question", tete, ty(question));
    var carte = el("div", "vote-carte", zone);
    var pied = el("div", "vote-pied", zone);
    var i = 0;
    function suivantNonVu() { for (var k = 0; k < items.length; k++) if (!(k in rep)) return k; return items.length; }
    function verdict(k) {
      var it = items[k], r = rep[k];
      if (it.n === "sondage") return "";
      if (r === "pas-sur") return "doute";
      return ((r === "oui") === (it.n === "vrai")) ? "juste" : "rate";
    }
    // les images de chaque énoncé : de vraies balises embarquées, rangées par numéro d'énoncé
    var sources = {};
    tous(".vote-source", zone).forEach(function (im) {
      var k = im.dataset.k; sources[k] = sources[k] || {}; sources[k][im.dataset.role] = im.getAttribute("src");
    });
    function idVideo(url) {
      var m = (url || "").match(/(?:v=|youtu\.be\/|embed\/)([\w-]{6,})/);
      return m ? m[1] : "";
    }
    function media(k, parent) {
      var it = items[k], src = sources[k] || {};
      if (!src.image && !it.video) return false;
      var boite = el("figure", "vote-media", parent);
      if (it.video && idVideo(it.video)) {
        var f = el("iframe", "vote-video", boite);
        f.src = "https://www.youtube-nocookie.com/embed/" + idVideo(it.video);
        f.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture");
        f.setAttribute("allowfullscreen", "");
        f.title = it.legende || it.t;
      } else if (src.fondu) {
        var cadre = el("div", "vote-fondu", boite);
        var a = el("img", "", cadre); a.src = src.image; a.alt = "";
        var b = el("img", "dessus", cadre); b.src = src.fondu; b.alt = ""; b.style.opacity = 0.5;
        var r = el("input", "vote-fondu-curseur", boite); r.type = "range"; r.min = 0; r.max = 100; r.value = 50;
        r.addEventListener("input", function () { b.style.opacity = r.value / 100; });
      } else if (parseFloat(it.zoom) > 1) {
        // comme la brique « loupe » : un clic agrandit dans le cadre, la souris parcourt, un second clic revient
        var z = parseFloat(it.zoom);
        var cadreZ = el("div", "vote-loupe", boite);
        var imz = el("img", "", cadreZ); imz.src = src.image; imz.alt = "";
        el("span", "vote-loupe-aide", cadreZ, EN ? "Click to zoom" : "Cliquez pour zoomer");
        function viser(e) {
          var r = cadreZ.getBoundingClientRect();
          var px = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1), py = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
          imz.style.transformOrigin = (px * 100) + "% " + (py * 100) + "%";
        }
        cadreZ.addEventListener("click", function (e) {
          var actif = cadreZ.classList.toggle("zoome");
          imz.style.transform = actif ? "scale(" + z + ")" : "";
          viser(e);
        });
        cadreZ.addEventListener("mousemove", function (e) { if (cadreZ.classList.contains("zoome")) viser(e); });
        cadreZ.addEventListener("touchmove", function (e) { if (cadreZ.classList.contains("zoome")) { viser(e.touches[0]); e.preventDefault(); } }, { passive: false });
      } else {
        var im = el("img", "", boite); im.src = src.image; im.alt = "";
      }
      var leg = el("figcaption", "", boite);
      if (it.legende) el("span", "", leg, ty(it.legende) + " ");
      if (it.lien) { var l = el("a", "", leg, EN ? "Source" : "Source"); l.href = it.lien; l.target = "_blank"; l.rel = "noopener"; }
      return true;
    }
    function afficher() {
      carte.innerHTML = ""; pied.innerHTML = "";
      if (i >= items.length) { bilan(); return; }
      compte.textContent = (i + 1) + " / " + items.length;
      var it = items[i];
      var gauche = el("div", "vote-gauche", carte);
      el("p", "vote-enonce", gauche, ty(it.t));
      var choix = el("div", "vote-choix", gauche);
      [["oui", T.oui], ["non", T.non], ["pas-sur", T.pasSur]].forEach(function (c) {
        var b = bouton(c[1], "vote-bouton " + c[0] + (rep[i] === c[0] ? " actif" : ""), choix, function () {
          rep[i] = c[0]; ecrire(cle, rep); afficher();
        });
        if (i in rep) b.disabled = true;
      });
      if (i in rep) {
        var v = verdict(i), retour = el("div", "vote-retour " + (v || "sondage"), gauche);
        if (it.n === "sondage") el("strong", "", retour, T.sondage);
        else {
          el("strong", "", retour, (v === "juste" ? T.juste : v === "rate" ? T.rate : T.doute) + " · " + (it.n === "vrai" ? T.possible : T.impossible) + " ");
          if (it.e) el("span", "", retour, ty(it.e));
        }
        var avec = media(i, carte);
        carte.classList.toggle("avec-media", avec);
        // avec une illustration, « Suivant » passe dans la colonne de texte, pour laisser la hauteur à l'image
        var suivant = bouton(T.suivant + " →", "principal", avec ? el("div", "vote-suivant", gauche) : pied, function () { i += 1; afficher(); });
      } else carte.classList.remove("avec-media");
    }
    function bilan() {
      carte.classList.remove("avec-media");
      compte.textContent = items.length + " / " + items.length;
      var j = 0, f = 0, d_ = 0, n = 0;
      items.forEach(function (it, k) {
        if (it.n === "sondage") return;
        n += 1; var v = verdict(k);
        if (v === "juste") j += 1; else if (v === "rate") f += 1; else d_ += 1;
      });
      if (n) el("p", "vote-bilan", carte, T.bilanVote(j, f, d_, n));
      var grille = el("div", "vote-grille", carte);
      items.forEach(function (it, k) {
        var v = verdict(k);
        var c = el("button", "vote-pastille " + (v || "sondage"), grille, ty(it.t));
        c.type = "button";
        c.title = it.n === "sondage" ? "" : (it.n === "vrai" ? T.possible : T.impossible);
        c.addEventListener("click", function () { i = k; afficher(); });
      });
      bouton(T.recommencer, "discret", pied, function () { rep = {}; ecrire(cle, rep); i = 0; afficher(); });
    }
    i = suivantNonVu();
    afficher();
  });

  // =====================================================================================
  // COMPROMIS : quatre curseurs centrés sur zéro ; monter l'un en fait baisser un autre
  // =====================================================================================
  var RAISONS = EN ? {
    "0-1": "Finer pixels mean a narrower swath: the satellite takes longer to come back over the same place.",
    "0-2": "More pixels and more bands mean too much data to record and send down: one has to choose.",
    "0-3": "A smaller pixel receives less light: the signal is weaker against the noise.",
    "1-2": "More bands mean more data to send down at each pass: images cannot be taken as often.",
    "1-3": "Frequent images leave less exposure time, or come from a higher orbit: less light reaches each pixel.",
    "2-3": "Narrower bands receive less light: each measurement is noisier."
  } : {
    "0-1": "Des pixels plus fins, c'est une fauchée plus étroite : le satellite met plus longtemps à revenir au même endroit.",
    "0-2": "Plus de pixels et plus de bandes, c'est trop de données à enregistrer et à descendre au sol : il faut choisir.",
    "0-3": "Un pixel plus petit reçoit moins de lumière : le signal est plus faible face au bruit.",
    "1-2": "Plus de bandes, c'est plus de données à descendre au sol à chaque passage : on ne peut pas acquérir aussi souvent.",
    "1-3": "Des images plus fréquentes laissent moins de temps de pose, ou viennent d'une orbite plus haute : chaque pixel reçoit moins de lumière.",
    "2-3": "Des bandes plus étroites reçoivent moins de lumière : chaque mesure est plus bruitée."
  };
  var NOMS_AXES = ["spatiale", "temporelle", "spectrale", "radiometrique", "spatial", "temporal", "spectral", "radiometric", "radiométrique"];
  function axeDe(mot) {
    var k = NOMS_AXES.indexOf(mot.toLowerCase());
    if (k === 8) return 3;
    return k < 0 ? -1 : k % 4;
  }
  function lireCondition(c) {
    var conds = [];
    (c || "").split(",").forEach(function (m) {
      var r = m.trim().match(/^([\wéèà]+)\s*(>=|<=|=)\s*(-?\d+)$/i);
      if (r && axeDe(r[1]) >= 0) conds.push({ a: axeDe(r[1]), op: r[2], v: parseInt(r[3], 10) });
    });
    return conds;
  }
  function verifie(conds, val) {
    return conds.every(function (c) {
      return c.op === ">=" ? val[c.a] >= c.v : c.op === "<=" ? val[c.a] <= c.v : val[c.a] === c.v;
    });
  }
  function faisable(conds) {
    var mini = [-3, -3, -3, -3];
    conds.forEach(function (c) { if (c.op !== "<=") mini[c.a] = Math.max(mini[c.a], c.v); });
    return mini.reduce(function (a, b) { return a + b; }, 0) <= 0;
  }
  tous(".compromis-zone").forEach(function (zone, numero) {
    stopper(zone.parentNode);
    var D = { objectifs: [], capteurs: [] };
    try { D = JSON.parse(zone.querySelector(".compromis-donnees").textContent); } catch (e) { /* vide */ }
    var objectifs = D.objectifs.map(function (o) { return { t: o.t, conds: lireCondition(o.c) }; });
    function proche(val) {
      var best = null, dmin = 1e9;
      D.capteurs.forEach(function (c) {
        var d2 = 0; for (var k = 0; k < 4; k++) d2 += Math.pow((c.v[k] || 0) - val[k], 2);
        if (d2 < dmin) { dmin = d2; best = c; }
      });
      return best;
    }
    if (CORRIGE) {
      var ul = el("ul", "compromis-imprime", zone);
      objectifs.forEach(function (o) {
        var li = el("li", "", ul); el("strong", "", li, ty(o.t) + " — ");
        var ok = D.capteurs.filter(function (c) { return verifie(o.conds, c.v); });
        el("span", "", li, faisable(o.conds) ? (ok.length ? ok.map(function (c) { return c.t; }).join(", ") : "—") : T.impossibleObj);
      });
      return;
    }
    var etat = lire("compromis:" + numero, { v: [0, 0, 0, 0], o: 0 });
    var gauche = el("div", "compromis-objectifs", zone);
    el("div", "compromis-titre", gauche, T.objectif);
    var boutonsObj = objectifs.map(function (o, k) {
      // changer d'objectif remet les curseurs à zéro : chaque objectif part du même capteur de référence
      return bouton(ty(o.t), "compromis-obj", gauche, function () {

      }
      var g3 = el("div", "hx-cas-menus", g2);
      menu("moyens", T.moyens, T.moyensListe, g3); menu("precision", T.precision, T.precisionListe, g3);
      champ("ecarts", T.champs[6][1], g2, true);
    }

    // --- page 3 : l'envoi ----------------------------------------------------------------
    var pageEnvoi = el("div", "hx-page hx-envoi-page", zone); pageEnvoi.hidden = true; pages.envoi.div = pageEnvoi;

    function montrer(nom) {
      Object.keys(pages).forEach(function (k) {
        pages[k].div.hidden = k !== nom;
        pages[k].bouton.classList.toggle("actif", k === nom);
      });
      if (nom === "cas") dessinerCas();
      if (nom === "envoi") panneauEnvoi(pageEnvoi, zone.dataset.envoi, d);
    }
    function changerCmd() {
      var c = cmd();
      carteCmd.innerHTML = "";
      el("div", "hx-client", carteCmd, c.client + " · " + c.donnee);
      el("div", "hx-question", carteCmd, ty(c.question));
      deplace = null; choisi = null;
      dessinerFamilles(); dessinerListe(); dessinerPlateau(); dessinerPersos();
      dialogue.hidden = true; info.innerHTML = ""; el("p", "hx-info-vide", info, T.infoVide);
      if (S.corr[S.cmd]) montrerCorrection(S.corr[S.cmd]); else { correction.hidden = true; liste.hidden = false; familles.hidden = false; }
      if (!pages.cas.div.hidden) dessinerCas();
    }
    changerCmd();
    montrer("chaine");
  });

  // --- l'envoi, partagé par l'atelier et la brique « envoi » ---------------------------------
  function paquet(d) {
    var S = lire("atelier", {});
    var votes = {};
    tous(".vote-zone").forEach(function (z, k) { votes["vote" + (k + 1)] = lire("vote:" + k, {}); });
    var projective = "";
    try { projective = JSON.parse(localStorage.getItem("image-intel:" + (document.title || "cours") + ":observer:projective") || '""'); } catch (e) { projective = ""; }
    var cmdId = S.cmd, c = d && d.cmd[cmdId];
    var corr = (S.corr || {})[cmdId];
    var plateau = (S.plateaux || {})[cmdId] || {};
    return {
      cours: document.title, date: new Date().toISOString(), groupe: S.groupe || "", noms: S.noms || "",
      commande: cmdId, commande_titre: c ? c.titre : "",
      chaine: Object.keys(plateau).map(function (k) { return plateau[k]; }),
      plateau: plateau,
      score: corr ? corr.ok + "/" + corr.n : "", manques: corr ? corr.manques : [], pieges: corr ? Object.keys(corr.tuiles).filter(function (i) { return corr.tuiles[i].etat === "piege"; }) : [],
      cas_reel: (S.fiches || {})[cmdId] || {},
      pepites: pepitesEntendues(d, S),
      votes: votes, projective: projective
    };
  }
  function pepitesEntendues(d, S) {
    if (!d) return [];
    var vusTous = [];
    Object.keys(S.vus || {}).forEach(function (k) { vusTous = vusTous.concat(S.vus[k]); });
    var trouvees = {};
    d.personnages.forEach(function (pe) {
      d.commandes.forEach(function (c) {
        questionsDe(d, pe, c).forEach(function (item) { if (item.q.pepite && vusTous.indexOf(item.cle) >= 0) trouvees[item.q.pepite] = true; });
      });
    });
    return Object.keys(trouvees);
  }
  function enTexte(p) {
    var l = [];
    l.push(p.cours + " — " + p.date);
    l.push("Groupe " + p.groupe + (p.noms ? " (" + p.noms + ")" : "") + " · commande : " + p.commande_titre);
    l.push("Chaîne : " + p.chaine.join(", "));
    l.push("Score : " + p.score + (p.manques.length ? " · manques : " + p.manques.join(" | ") : ""));
    Object.keys(p.cas_reel).forEach(function (k) { l.push("Cas réel, " + k + " : " + (Array.isArray(p.cas_reel[k]) ? p.cas_reel[k].join(" / ") : p.cas_reel[k])); });
    if (p.projective) l.push("Projet un peu fou : " + p.projective);
    return l.join("\n");
  }
  function panneauEnvoi(parent, url, d) {
    parent.innerHTML = "";
    var S = lire("atelier", {});
    el("div", "hx-corr-titre", parent, T.envoiTitre);
    el("p", "", parent, ty(T.envoiAide));
    var ln = el("label", "hx-cas-champ", parent); el("span", "", ln, T.noms);
    var noms = el("input", "", ln); noms.value = S.noms || "";
    noms.addEventListener("input", function () { var s = lire("atelier", {}); s.noms = noms.value; ecrire("atelier", s); });
    var apercu = el("pre", "hx-apercu", parent, enTexte(paquet(d)));
    var etat = el("p", "hx-envoi-etat", parent);
    var ligne = el("div", "hx-corr-pied", parent);
    var b = bouton(T.envoiBouton, "principal", ligne, function () {
      var p = paquet(d);
      if (!p.groupe) { etat.textContent = T.groupeManque; return; }
      if (!url) { etat.textContent = T.envoiAbsent; return; }
      b.disabled = true;
      fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) })
        .then(function () { etat.textContent = T.envoiFait; })
        .catch(function () { etat.textContent = T.envoiErreur; })
        .then(function () { b.disabled = false; });
    });
    if (!url) { b.classList.add("inactif"); etat.textContent = T.envoiAbsent; }
    bouton(T.telecharger, "", ligne, function () {
      var p = paquet(d);
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(p, null, 2)], { type: "application/json" }));
      a.download = "atelier-groupe-" + (p.groupe || "x") + "-" + p.commande + ".json";
      document.body.appendChild(a); a.click(); a.remove();
    });
    bouton(T.copier, "", ligne, function () {
      var t = enTexte(paquet(d));
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { etat.textContent = T.copie; });
    });
    if (window.Reveal) window.Reveal.on("slidechanged", function (e) { if (e.currentSlide.contains(parent)) apercu.textContent = enTexte(paquet(d)); });
  }
  tous(".hx-envoi").forEach(function (zone) {
    stopper(zone.parentNode);
    if (EN_PDF) { el("p", "hx-pdf-note", zone, T.interactif); return; }
    var d = donnees(zone.dataset.source);
    var atelier = document.querySelector(".hx-atelier");
    panneauEnvoi(zone, atelier ? atelier.dataset.envoi : "", d);
  });

  // =====================================================================================
  // CHAÎNE DE RÉFÉRENCE et PÉPITES
  // =====================================================================================
  tous(".hx-chaine").forEach(function (zone) {
    var d = donnees(zone.dataset.source);
    if (!d || !d.cmd[zone.dataset.commande]) return;
    var c = d.cmd[zone.dataset.commande];
    var rangee = el("div", "hx-chaine-rangee", zone);
    c.chaine.forEach(function (id, k) {
      var hx = hexa(d, id, "chaine", rangee);
      hx.style.setProperty("--k", k);
    });
  });
  tous(".hx-pepites").forEach(function (zone) {
    var d = donnees(zone.dataset.source);
    if (!d) return;
    function dessiner() {
      zone.innerHTML = "";
      var S = lire("atelier", {}), entendues = pepitesEntendues(d, S);
      if (!EN_PDF) el("p", "hx-pep-compte", zone, T.pepitesCompte(entendues.length, d.pepites.length));
      var ul = el("ul", "hx-pep-liste", zone);
      d.pepites.forEach(function (p) {
        var vu = entendues.indexOf(p.id) >= 0;
        var li = el("li", vu || EN_PDF ? "vue" : "", ul);
        el("span", "hx-pep-etoile", li, vu ? "★" : "☆");
        el("span", "", li, ty(p.texte));
      });
    }
    dessiner();
    if (window.Reveal) window.Reveal.on("slidechanged", function (e) { if (e.currentSlide.contains(zone)) dessiner(); });
  });
})();
</script>
