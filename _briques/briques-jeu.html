<script>
/* Briques du jeu de rôle (atelier Saumos, V3.1).
   Le contenu est dans le fichier de données du cours (donnees/saumos.json) ; ce moteur ne contient aucun texte de jeu,
   seulement les libellés d'interface. Ce que fait le joueur reste dans son navigateur.
   Briques : jdr-commande, jdr-paris, jdr-equipe, jdr-cadrage, jdr-experts, jdr-enquete, jdr-labo, jdr-rapport,
   jdr-phrase, jdr-bulle, jdr-retour. Dans les textes, [[mot affiché|terme]] devient un terme technique cliquable. */
(function () {
  var zones = Array.prototype.slice.call(document.querySelectorAll(".jdr-zone"));
  if (!zones.length) return;
  function tous(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(nom, classe, parent, texte) {
    var e = document.createElement(nom);
    if (classe) e.className = classe;
    if (texte !== undefined && texte !== null) e.textContent = texte;
    if (parent) parent.appendChild(e);
    return e;
  }
  function bouton(texte, classe, parent, action) {
    var b = el("button", "jdr-btn" + (classe ? " " + classe : ""), parent, texte);
    b.type = "button";
    if (action) b.addEventListener("click", action);
    return b;
  }
  var params = new URLSearchParams(window.location.search);
  var EN_PDF = params.has("print-pdf");
  function ty(s) { return String(s || "").replace(/ ([:;!?»])/g, " $1").replace(/« /g, "« "); }
  function simple(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function aller(id) { location.hash = "#/" + id; }

  var D = {}, PX = {}, IMG = {};
  try { D = JSON.parse(document.querySelector(".jdr-donnees").textContent); } catch (e) { return; }
  try { PX = JSON.parse(document.querySelector(".jdr-pixels").textContent); } catch (e) { PX = {}; }
  tous("img.jdr-img").forEach(function (i) { IMG[i.dataset.cle] = i.getAttribute("src"); });
  D.termes = D.termes || {};
  var EXP = {}; D.experts.forEach(function (x) { EXP[x.id] = x; });
  var POST = {}; D.postures.forEach(function (p) { POST[p.id] = p; });
  var LABO_DE = {}; D.postures.forEach(function (p) { LABO_DE[p.enquete] = p.labo; });
  var racine = document.querySelector(".reveal");
  if (racine) racine.classList.add("jdr-jeu");

  // --- La mémoire du joueur ------------------------------------------------------------------
  var CLE = "jdr:" + (document.title || "atelier");
  var memoire = null;
  function S() {
    if (memoire) return memoire;
    try { memoire = JSON.parse(localStorage.getItem(CLE) || "null"); } catch (e) { memoire = null; }
    memoire = memoire || {};
    ["vus", "essais", "succes", "accueils", "debloques", "indices", "termes", "clefs", "rapport", "paris", "prefet", "chrono"].forEach(function (k) { memoire[k] = memoire[k] || {}; });
    memoire.journal = memoire.journal || [];
    if (typeof memoire.confiance !== "number") memoire.confiance = 6;
    return memoire;
  }
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(memoire)); } catch (e) { /* stockage indisponible */ } }
  var abonnes = [];
  function changer() { sauver(); abonnes.forEach(function (f) { try { f(); } catch (e) { if (window.console) console.error(e); } }); }
  function confiance(delta) { var s = S(); s.confiance = Math.max(0, Math.min(10, s.confiance + delta)); }
  function acces(k) { var s = S(); return !!(s.solo || !s.posture || POST[s.posture].enquete === k); }
  function noter(champs) { var F = S().rapport; Object.keys(champs).forEach(function (k) { F[k] = champs[k]; }); }
  function journal(qui, texte) { var j = S().journal; j.push([qui, plat(texte)]); if (j.length > 300) j.splice(0, j.length - 300); }
  function monEnquete() { var s = S(); return s.posture ? POST[s.posture].enquete : "A"; }

  // --- Le texte riche : les termes techniques ---------------------------------------------------
  var MOTIF = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
  function plat(s) { return String(s || "").replace(MOTIF, "$1"); }
  function morceaux(s) {
    var out = [], i = 0, m; s = ty(s); MOTIF.lastIndex = 0;
    while ((m = MOTIF.exec(s))) {
      if (m.index > i) out.push({ t: s.slice(i, m.index) });
      out.push({ t: m[1], terme: m[2] || m[1] });
      i = m.index + m[0].length;
    }
    if (i < s.length) out.push({ t: s.slice(i) });
    return out;
  }
  function noeuds(cible, s) {
    // le texte, construit vide : la machine à écrire le remplit morceau par morceau
    cible.textContent = "";
    return morceaux(s).map(function (m) {
      var n;
      if (m.terme && D.termes[m.terme]) {
        n = el("span", "jdr-terme" + (S().termes[m.terme] ? " connu" : ""), cible); n.dataset.terme = m.terme;
        n.title = "Cliquer pour en savoir plus";
      } else n = cible.appendChild(document.createTextNode(""));
      return { n: n, t: m.t };
    });
  }
  function riche(cible, s) { noeuds(cible, s).forEach(function (m) { m.n.textContent = m.t; }); return cible; }
  function elRiche(nom, classe, parent, s) { return riche(el(nom, classe, parent), s); }
  function apprendre(id, z) {
    var s = S(); if (s.termes[id]) return;
    s.termes[id] = true;
    tous('.jdr-terme[data-terme="' + id + '"]').forEach(function (t) { t.classList.add("connu"); });
    if (z) toast(z, "Carnet : « " + D.termes[id].mot + " »", "carnet");
    changer();
  }
  function fenetreTerme(id, span) {
    // hors d'un dialogue (paris, carnet, cadrage…) : une petite fenêtre, le terme rangé dans le carnet
    var T = D.termes[id]; if (!T) return;
    var z = span.closest(".jdr-zone");
    apprendre(id, z && z.querySelector(".jdr-toasts") ? z : null);
    var sec = span.closest("section") || racine;
    var vieux = sec.querySelector(".jdr-popup"); if (vieux) vieux.remove();
    var p = el("div", "jdr-popup", sec);
    var x = EXP[T.qui];
    var h = el("div", "jdr-popup-tete", p);
    if (x) tete(x.id, "petit", h);
    el("strong", "", h, T.mot);
    el("p", "", p, ty(T.texte));
    var b = el("div", "jdr-choix-ligne", p);
    el("span", "jdr-note-labo", b, "✓ Rangé dans votre carnet" + (x ? " — " + x.prenom : ""));
    bouton("Fermer ✕", "petit", b, function () { p.remove(); });
    ["pointerdown", "click", "wheel", "touchstart"].forEach(function (n) { p.addEventListener(n, function (e) { e.stopPropagation(); }); });
  }
  function stopper(e_) {
    e_.addEventListener("click", function (e) {
      var t = e.target.closest && e.target.closest(".jdr-terme");
      if (!t || e._jdrFini) return;
      var z = t.closest(".jdr-zone");
      if (z && z._terme && z._terme(t.dataset.terme, t)) return;
      fenetreTerme(t.dataset.terme, t);
    });
    // le clavier n'est pas arrêté ici : Reveal ignore déjà les touches tapées dans un champ
    ["pointerdown", "click", "wheel", "touchstart", "dblclick"].forEach(function (n) {
      e_.addEventListener(n, function (e) { e.stopPropagation(); });
    });
  }

  // --- Le son : un bip de lecture, sans langue, comme dans les JRPG ----------------------------
  var SON = { ctx: null, on: true };
  try { SON.on = localStorage.getItem("jdr:son") !== "0"; } catch (e) { /* par défaut, le son */ }
  function bip(freq) {
    if (!SON.on || EN_PDF || !freq) return;
    try {
      if (!SON.ctx) SON.ctx = new (window.AudioContext || window.webkitAudioContext)();
      var c = SON.ctx; if (c.state === "suspended") c.resume();
      var o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = "square"; o.frequency.value = freq * (0.9 + Math.random() * 0.2);
      g.gain.setValueAtTime(0.03, t); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.05);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.06);
    } catch (e) { /* pas de son, tant pis */ }
  }
  function boutonSon(parent) {
    var b = bouton("", "jdr-son", parent, function () {
      SON.on = !SON.on;
      try { localStorage.setItem("jdr:son", SON.on ? "1" : "0"); } catch (e) { /* rien */ }
      tous(".jdr-son").forEach(maj);
    });
    function maj(x) { x.textContent = SON.on ? "♪ son" : "♪ muet"; x.classList.toggle("muet", !SON.on); x.title = SON.on ? "Couper le son" : "Remettre le son"; }
    maj(b);
    return b;
  }

  // --- Têtes et paroles ------------------------------------------------------------------------
  function tete(id, classe, parent) {
    var b = el("span", "jdr-tete" + (classe ? " " + classe : ""), parent);
    b.innerHTML = PX[id] || "";
    return b;
  }
  function parler(boite, cible, texte, fin, voix) {
    // la réplique défile ; un clic l'affiche d'un coup (et ne déclenche pas le terme cliqué)
    if (cible._arret) cible._arret();          // une réplique coupe la précédente
    var parts = noeuds(cible, texte), plein = parts.map(function (p) { return p.t; }).join(""), k = 0, n = 0, timer;
    if (boite) boite.classList.add("parle");
    function montrer(c) { var reste = c; parts.forEach(function (p) { p.n.textContent = p.t.slice(0, Math.max(0, Math.min(p.t.length, reste))); reste -= p.t.length; }); }
    function arret() { clearInterval(timer); if (boite) boite.classList.remove("parle"); cible.removeEventListener("click", finir); cible._arret = null; }
    function finir(e) {
      if (e && e.type === "click") e._jdrFini = true;
      arret(); montrer(plein.length);
      if (fin) { var f = fin; fin = null; f(); }
    }
    cible._arret = arret;
    cible.addEventListener("click", finir);
    if (EN_PDF) { finir(); return finir; }
    timer = setInterval(function () {
      k += 2; n += 1; montrer(k);
      if (n % 3 === 0 && /\S/.test(plein.charAt(k))) bip(voix);
      if (k >= plein.length) finir();
    }, 24);
    return finir;
  }
  function toast(zone, texte, genre) {
    var boite = zone.querySelector(".jdr-toasts") || zone;
    var t = el("div", "jdr-toast " + (genre || ""), boite, ty(texte));
    var vus = boite.querySelectorAll(".jdr-toast");
    for (var i = 0; i < vus.length - 3; i++) vus[i].remove();      // trois au plus à l'écran
    setTimeout(function () { t.classList.add("part"); }, 3200);
    setTimeout(function () { t.remove(); }, 3800);
  }
  function confianceHTML(parent) {
    var c = el("div", "jdr-confiance", parent);
    el("span", "jdr-conf-nom", c, "Confiance du préfet");
    var j = el("span", "jdr-conf-jauge", c);
    for (var k = 0; k < 10; k++) el("i", k < S().confiance ? "plein" : "", j);
    return c;
  }

  // --- Le chrono : 30 minutes d'enquête, puis 5 de rapport ------------------------------------
  function chrono() {
    var c = S().chrono; if (!c.debut) return null;
    var now = Date.now();
    if (c.rapport) return { phase: "rapport", reste: c.rapport + D.chrono.rapport * 60000 - now };
    return { phase: "enquete", reste: c.debut + D.chrono.enquete * 60000 - now };
  }
  function mmss(ms) { ms = Math.max(0, ms); var s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
  function demarrer() { var c = S().chrono; if (!c.debut) { c.debut = Date.now(); changer(); } }
  function versRapport() { var c = S().chrono; if (!c.rapport) { c.rapport = Date.now(); if (!c.debut) c.debut = c.rapport; changer(); } aller("rapport"); }
  function cestParti() {
    demarrer();
    if (!S().posture && !S().solo) {
      // pas de posture : on renvoie une fois vers l'équipe, en montrant où choisir (pas de boucle)
      aller("equipe");
      setTimeout(function () { tous("#equipe .jdr-posture").forEach(function (b) { b.classList.add("clignote"); setTimeout(function () { b.classList.remove("clignote"); }, 2600); }); }, 400);
      return;
    }
    aller("enquete-" + monEnquete().toLowerCase());
  }
  function boutonChrono(parent) {
    var b = bouton("", "jdr-chrono", parent);
    b.addEventListener("click", function () {
      var c = chrono();
      if (c && c.phase === "rapport") { aller("rapport"); return; }
      if (b.dataset.sur) { versRapport(); return; }
      b.dataset.sur = "1"; b.classList.add("sur");
      setTimeout(function () { delete b.dataset.sur; b.classList.remove("sur"); majChrono(b); }, 4000);
      majChrono(b);
    });
    majChrono(b);
    return b;
  }
  function majChrono(b) {
    var c = chrono();
    if (b.dataset.sur) { b.textContent = "Passer au rapport ? (5 min) ✓"; return; }
    if (!c) { b.textContent = "⧗ " + D.chrono.enquete + ":00 · rapport"; b.title = "Le chrono démarre avec « C'est parti »"; return; }
    b.textContent = (c.phase === "rapport" ? "✎ rapport " : "⧗ ") + mmss(c.reste) + (c.phase === "enquete" ? " · rapport" : "");
    b.classList.toggle("urgent", c.reste < 120000);
    b.title = c.phase === "enquete" ? "Cliquer pour passer au rapport (5 minutes)" : "Temps du rapport";
  }
  setInterval(function () {
    tous(".jdr-chrono").forEach(majChrono);
    var c = chrono(), s = S();
    if (c && c.phase === "enquete" && c.reste <= 0) {
      s.chrono.rapport = Date.now(); changer();
      var ici = window.Reveal && Reveal.getCurrentSlide();
      if (ici && ici.querySelector(".jdr-enquete-zone, .jdr-labo-zone")) aller("rapport");
    }
  }, 1000);

  // --- La navigation : deux boutons en bas à droite, en plus du clavier (qui reste actif) ---
  (function () {
    if (EN_PDF || !window.Reveal || !racine) return;
    // dans le cadre des diapos : les boutons suivent l'échelle de la diapo, toujours en bas à droite
    var nav = el("div", "jdr-nav", racine.querySelector(".slides") || racine);
    var g = bouton("◀", "jdr-nav-btn", nav), d = bouton("▶", "jdr-nav-btn droite", nav);
    ["pointerdown", "click", "touchstart"].forEach(function (n) { nav.addEventListener(n, function (e) { e.stopPropagation(); }); });
    var actions = { g: null, d: null };
    g.addEventListener("click", function () { if (actions.g) actions.g(); });
    d.addEventListener("click", function () { if (actions.d) actions.d(); });
    function maj() {
      var sec = Reveal.getCurrentSlide(); if (!sec) return;
      var id = sec.id || "", s = S(), h = Reveal.getIndices().h, n = Reveal.getTotalSlides(), m;
      var G = { t: "◀", f: function () { Reveal.prev(); }, vis: h > 0 };
      var R = { t: "▶", f: function () { Reveal.next(); }, vis: h < n - 1 };
      if (id === "equipe" && !s.posture && !s.solo) { R.t = "Choisissez une posture"; R.off = true; }
      if (id === "cadrage") R.t = "Continuer ▶";
      if (id === "experts") { R.t = "C'est parti ▶"; R.f = cestParti; R.clin = true; }
      if ((m = id.match(/^enquete-([abc])$/))) {
        var lab = LABO_DE[m[1].toUpperCase()], ok = !!s.clefs[lab];
        G = { t: "◀ experts", f: function () { aller("experts"); }, vis: true };
        R = { t: (ok ? "🔑 " : "🔒 ") + D.labos[lab].titre + " ▶", f: function () { aller("labo-" + lab); }, vis: true, off: !ok, clin: ok };
      }
      if ((m = id.match(/^labo-([abc])$/))) {
        var enq = D.labos[m[1]].enquete;
        G = { t: "◀ enquête " + enq, f: function () { aller("enquete-" + enq.toLowerCase()); }, vis: true };
        R = { vis: false };
      }
      if (id === "rapport") G = { t: "◀ enquête", f: function () { aller("enquete-" + monEnquete().toLowerCase()); }, vis: true };
      g.textContent = G.t; g.hidden = !G.vis; actions.g = G.f;
      d.textContent = R.t || ""; d.hidden = !R.vis; actions.d = R.f; d.disabled = !!R.off; d.classList.toggle("clignote", !!R.clin);
      d.title = !R.off ? "" : id === "equipe" ? "Choisissez d'abord votre posture (ou le mode solo)" : "Fermé : un expert vous en passera les clefs";
    }
    Reveal.on("slidechanged", maj); Reveal.on("ready", maj); abonnes.push(maj); setTimeout(maj, 0);
  })();

  // --- Le titre qui passe en 8 bits -------------------------------------------------------------
  (function () {
    var h = document.querySelector("#title-slide h1.title");
    if (!h || EN_PDF) return;
    var lettres = [];
    var texte = h.textContent; h.textContent = ""; h.classList.add("jdr-glitch");
    // une boîte par mot (pas de coupure au milieu d'un mot), une boîte par lettre
    texte.split(/(\s+)/).forEach(function (m) {
      if (!m) return;
      if (/^\s+$/.test(m)) { h.appendChild(document.createTextNode(" ")); return; }
      var mot = el("span", "jdr-mot", h);
      Array.prototype.forEach.call(m, function (c) { lettres.push(el("span", "", mot, c)); });
    });
    var sens = true, pas = 0;
    setInterval(function () {
      var restants = lettres.filter(function (s) { return s.classList.contains("px") !== sens; });
      if (!restants.length) { pas += 1; if (pas > 14) { sens = !sens; pas = 0; } return; }
      restants[Math.floor(Math.random() * restants.length)].classList.toggle("px", sens);
    }, 90);
  })();

  // =========================================================================================
  var BRIQUES = {};

  // La commande du préfet, et la carte de la région ---------------------------------------------
  BRIQUES["jdr-commande"] = function (z) {
    var g = el("div", "jdr-commande-g", z);
    var gauche = el("div", "", g);
    var b = el("div", "jdr-scene", gauche);
    var t = tete("prefet", "grand", b);
    var boite = el("div", "jdr-dialogue", b);
    el("div", "jdr-plaque", boite, D.prefet.nom);
    var txt = el("p", "jdr-texte", boite);
    var bas = el("div", "jdr-choix-ligne", gauche); boutonSon(bas);
    if (D.carte) carte(g, D.carte);
    if (EN_PDF) { riche(txt, D.prefet.commande); return; }
    var lu = false;
    function lancer() { if (!lu) { lu = true; parler(t, txt, D.prefet.commande, null, 150); } }
    if (window.Reveal) Reveal.on("slidechanged", function (e) { if (e.currentSlide.contains(z)) lancer(); });
    txt.textContent = "▶";
    b.addEventListener("click", lancer);
  };
  function carte(parent, C) {
    var c = el("div", "jdr-carte8", parent);
    el("div", "jdr-sous", c, C.titre);
    var cadre = el("div", "jdr-carte8-cadre", c);
    var im = el("img", "", cadre); im.src = IMG[C.image]; im.alt = "";
    C.lieux.forEach(function (l) {
      var x = (l[2] - C.lon0) / (C.lon1 - C.lon0) * 100, y = (C.lat1 - l[1]) / (C.lat1 - C.lat0) * 100;
      var p = el("div", "jdr-lieu " + (l[3] || "") + (x > 70 ? " gauche" : ""), cadre); p.style.left = x + "%"; p.style.top = y + "%";
      el("i", "", p); el("span", "", p, l[0]);
    });
    el("p", "jdr-note-labo", c, ty(C.legende));
  }

  // Les paris ------------------------------------------------------------------------------------
  BRIQUES["jdr-paris"] = function (z) {
    D.paris.forEach(function (p) {
      var c = el("div", "jdr-carte jdr-pari", z);
      elRiche("p", "jdr-pari-q", c, p.q);
      if (p.choix) {
        var l = el("div", "jdr-choix-ligne", c);
        p.choix.forEach(function (o) {
          var b = bouton(o, "jdr-opt" + (S().paris[p.id] === o ? " sel" : ""), l, function () {
            S().paris[p.id] = o; tous(".jdr-opt", l).forEach(function (x) { x.classList.toggle("sel", x === b); }); changer();
          });
        });
      } else {
        var v = S().paris[p.id] !== undefined ? S().paris[p.id] : p.defaut;
        var val = el("div", "jdr-pari-val", c, v + " " + p.unite);
        var r = el("input", "jdr-pari-curseur", c); r.type = "range"; r.min = p.min; r.max = p.max; r.value = v;
        r.addEventListener("input", function () { S().paris[p.id] = +r.value; val.textContent = r.value + " " + p.unite; changer(); });
      }
    });
  };

  // L'équipe : posture, mode solo, tête, nom, groupe ----------------------------------------------
  BRIQUES["jdr-equipe"] = function (z) {
    var haut = el("div", "jdr-equipe-haut", z);
    var lg = el("label", "jdr-champ", haut); el("span", "", lg, "Groupe n°");
    var g = el("input", "", lg); g.type = "number"; g.min = 1; g.max = 30; g.value = S().groupe || "";
    g.addEventListener("input", function () { S().groupe = g.value; changer(); });
    var ln = el("label", "jdr-champ large", haut); el("span", "", ln, "Ton prénom de héros");
    var n = el("input", "", ln); n.value = S().nom || ""; n.placeholder = "comme tu veux";
    n.addEventListener("input", function () { S().nom = n.value; changer(); });
    var lsolo = el("label", "jdr-solo", haut);
    var cs = el("input", "", lsolo); cs.type = "checkbox"; cs.checked = !!S().solo;
    var ts = el("span", "", lsolo); el("strong", "", ts, "Je joue en solo"); el("span", "", ts, "j'ai accès aux trois profils, l'un après l'autre");
    cs.addEventListener("change", function () { S().solo = cs.checked; changer(); });
    el("div", "jdr-sous", z, "1. Ta posture");
    var ps = el("div", "jdr-postures", z);
    D.postures.forEach(function (p) {
      var c = el("button", "jdr-carte jdr-posture" + (S().posture === p.id ? " sel" : ""), ps); c.type = "button";
      el("strong", "", c, p.nom);
      el("span", "jdr-posture-enq", c, "Enquête " + p.enquete + " · " + D.enquetes[p.enquete].titre + " · " + D.labos[p.labo].titre);
      el("span", "jdr-posture-role", c, ty(p.role));

    function remplir() {

    function heure(v) { var m = v.match(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?/); return m ? (+m[1]) * 60 + (+(m[2] || 0)) : null; }
    function verifie(id) {
      var f = F(), v = function (k) { return simple(f[k] || ""); };

        case "source": return /met[eo]*\s*-?\s*sat|\bmsg\b|\bmtg\b|seviri|\bfci\b/.test(v("a_nom"));
