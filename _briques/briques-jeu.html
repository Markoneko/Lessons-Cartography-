<script>
/* Briques du jeu de rôle (atelier Saumos) : commande du préfet, paris, équipe, experts, répartition,
   enquêtes (dialogues à indices), labos de secours, rapport au propre, sévérité, phrase de la classe, bulles.
   Tout le contenu est dans le fichier de données du cours ; ce qui est fait reste dans le navigateur. */
(function () {
  var zones = Array.prototype.slice.call(document.querySelectorAll(".jdr-zone"));
  if (!zones.length) return;
  function tous(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(nom, classe, parent, texte) {
    var e = document.createElement(nom);
    if (classe) e.className = classe;
    if (texte !== undefined && texte !== null) e.textContent = texte;
    if (parent) parent.appendChild(e);
    return e;
  }
  function bouton(texte, classe, parent, action) {
    var b = el("button", "jdr-btn" + (classe ? " " + classe : ""), parent, texte);
    b.type = "button";
    if (action) b.addEventListener("click", action);
    return b;
  }
  function stopper(e_) {
    // le clavier reste à Reveal : il ignore déjà les touches tapées dans un champ
    ["pointerdown", "click", "wheel", "touchstart", "dblclick"].forEach(function (n) {
      e_.addEventListener(n, function (e) { e.stopPropagation(); });
    });
  }
  var params = new URLSearchParams(window.location.search);
  var EN_PDF = params.has("print-pdf");
  function ty(s) { return String(s || "").replace(/ ([:;!?»])/g, " $1").replace(/« /g, "« "); }

  var D = {}, PX = {}, IMG = {};
  try { D = JSON.parse(document.querySelector(".jdr-donnees").textContent); } catch (e) { return; }
  try { PX = JSON.parse(document.querySelector(".jdr-pixels").textContent); } catch (e) { PX = {}; }
  tous("img.jdr-img").forEach(function (i) { IMG[i.dataset.cle] = i.getAttribute("src"); });
  var EXP = {}; D.experts.forEach(function (x) { EXP[x.id] = x; });
  var POST = {}; D.postures.forEach(function (p) { POST[p.id] = p; });

  // --- La mémoire du joueur ------------------------------------------------------------------
  var CLE = "jdr:" + (document.title || "atelier");
  var memoire = null;
  function S() {
    if (memoire) return memoire;
    try { memoire = JSON.parse(localStorage.getItem(CLE) || "null"); } catch (e) { memoire = null; }
    memoire = memoire || {};
    ["vus", "accueils", "debloques", "indices", "pistes", "rapport", "paris", "surf", "points"].forEach(function (k) { memoire[k] = memoire[k] || {}; });
    if (typeof memoire.confiance !== "number") memoire.confiance = 6;
    return memoire;
  }
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(memoire)); } catch (e) { /* stockage indisponible */ } }
  var abonnes = [];
  function changer() { sauver(); abonnes.forEach(function (f) { try { f(); } catch (e) { /* une brique ne casse pas les autres */ } }); }

  // --- Têtes et bulles ------------------------------------------------------------------------
  function tete(id, classe, parent) {
    var b = el("span", "jdr-tete" + (classe ? " " + classe : ""), parent);
    b.innerHTML = PX[id] || "";
    return b;
  }
  function parler(boite, cible, texte, fin) {
    // la réplique défile ; un clic l'affiche d'un coup
    var t = ty(texte), k = 0, timer;
    if (cible._arret) cible._arret();          // une réplique coupe la précédente
    cible.textContent = "";
    if (boite) boite.classList.add("parle");
    function arret() { clearInterval(timer); if (boite) boite.classList.remove("parle"); cible.removeEventListener("click", finir); cible._arret = null; }
    function finir() {
      arret(); cible.textContent = t;
      if (fin) { var f = fin; fin = null; f(); }
    }
    cible._arret = arret;
    cible.addEventListener("click", finir);
    timer = setInterval(function () {
      k += 2; cible.textContent = t.slice(0, k);
      if (k >= t.length) finir();
    }, 22);
    return finir;
  }
  function toast(zone, texte, genre) {
    var boite = zone.querySelector(".jdr-toasts") || zone;
    var t = el("div", "jdr-toast " + (genre || ""), boite, ty(texte));
    var vus = boite.querySelectorAll(".jdr-toast");
    for (var i = 0; i < vus.length - 3; i++) vus[i].remove();      // trois au plus à l'écran
    setTimeout(function () { t.classList.add("part"); }, 3000);
    setTimeout(function () { t.remove(); }, 3600);
  }
  function confianceHTML(parent) {
    var c = el("div", "jdr-confiance", parent);
    el("span", "jdr-conf-nom", c, "Confiance du préfet");
    var j = el("span", "jdr-conf-jauge", c);
    for (var k = 0; k < 10; k++) el("i", k < S().confiance ? "plein" : "", j);
    return c;
  }
  function confiance(delta) { var s = S(); s.confiance = Math.max(0, Math.min(10, s.confiance + delta)); }

  // =========================================================================================
  var BRIQUES = {};

  // La commande du préfet --------------------------------------------------------------------
  BRIQUES["jdr-commande"] = function (z) {
    var b = el("div", "jdr-scene", z);
    var t = tete("prefet", "grand", b);
    var boite = el("div", "jdr-dialogue", b);
    el("div", "jdr-plaque", boite, D.prefet.nom);
    var txt = el("p", "jdr-texte", boite);
    if (EN_PDF) { txt.textContent = ty(D.prefet.commande); return; }
    var lu = false;
    function lancer() { if (!lu) { lu = true; parler(t, txt, D.prefet.commande); } }
    if (window.Reveal) Reveal.on("slidechanged", function (e) { if (e.currentSlide.contains(z)) lancer(); });
    txt.textContent = "▶";
    b.addEventListener("click", lancer);
  };

  // Les paris ------------------------------------------------------------------------------------
  BRIQUES["jdr-paris"] = function (z) {
    D.paris.forEach(function (p) {
      var c = el("div", "jdr-carte jdr-pari", z);
      el("p", "jdr-pari-q", c, ty(p.q));
      if (p.choix) {
        var l = el("div", "jdr-choix-ligne", c);
        p.choix.forEach(function (o) {
          var b = bouton(o, "jdr-opt" + (S().paris[p.id] === o ? " sel" : ""), l, function () {
            S().paris[p.id] = o; tous(".jdr-opt", l).forEach(function (x) { x.classList.toggle("sel", x === b); }); changer();
          });
        });
      } else {
        var v = S().paris[p.id] !== undefined ? S().paris[p.id] : p.defaut;
        var val = el("div", "jdr-pari-val", c, v + " " + p.unite);
        var r = el("input", "jdr-pari-curseur", c); r.type = "range"; r.min = p.min; r.max = p.max; r.value = v;
        r.addEventListener("input", function () { S().paris[p.id] = +r.value; val.textContent = r.value + " " + p.unite; changer(); });
      }
    });
  };

  // L'équipe : posture, tête, nom, groupe -----------------------------------------------------
  BRIQUES["jdr-equipe"] = function (z) {
    var haut = el("div", "jdr-equipe-haut", z);
    var lg = el("label", "jdr-champ", haut); el("span", "", lg, "Groupe n°");
    var g = el("input", "", lg); g.type = "number"; g.min = 1; g.max = 30; g.value = S().groupe || "";
    g.addEventListener("input", function () { S().groupe = g.value; changer(); });
    var ln = el("label", "jdr-champ large", haut); el("span", "", ln, "Ton prénom de héros");
    var n = el("input", "", ln); n.value = S().nom || ""; n.placeholder = "comme tu veux";
    n.addEventListener("input", function () { S().nom = n.value; changer(); });
    el("div", "jdr-sous", z, "1. Ta posture");
    var ps = el("div", "jdr-postures", z);
    D.postures.forEach(function (p) {
      var c = el("button", "jdr-carte jdr-posture" + (S().posture === p.id ? " sel" : ""), ps); c.type = "button";
      el("strong", "", c, p.nom);
      el("span", "jdr-posture-enq", c, "Enquête " + p.enquete + " · " + D.enquetes[p.enquete].titre);
      el("span", "jdr-posture-role", c, ty(p.role));
      c.addEventListener("click", function () { S().posture = p.id; tous(".jdr-posture", ps).forEach(function (x) { x.classList.toggle("sel", x === c); }); changer(); });
    });
    el("div", "jdr-sous", z, "2. Ta tête");
    var hs = el("div", "jdr-heros", z);
    D.heros.forEach(function (h) {
      var b = el("button", "jdr-heros-btn" + (S().heros === h ? " sel" : ""), hs); b.type = "button";
      tete(h, "", b);
      b.addEventListener("click", function () { S().heros = h; tous(".jdr-heros-btn", hs).forEach(function (x) { x.classList.toggle("sel", x === b); }); changer(); });
    });
    // un poste partagé, ou un nouvel essai : tout effacer (deux clics, sans boîte de dialogue)
    var raz = bouton("Recommencer la partie", "discret", z);
    raz.addEventListener("click", function () {
      if (raz.dataset.sur) { try { localStorage.removeItem(CLE); } catch (e) { /* rien à effacer */ } location.hash = ""; location.reload(); return; }
      raz.dataset.sur = "1"; raz.textContent = "Tout effacer ? Cliquer encore pour confirmer";
      setTimeout(function () { delete raz.dataset.sur; raz.textContent = "Recommencer la partie"; }, 4000);
    });
  };

  // Les experts ----------------------------------------------------------------------------------
  BRIQUES["jdr-experts"] = function (z) {
    var g = el("div", "jdr-experts-g", z);
    D.experts.forEach(function (x) {
      var c = el("div", "jdr-carte jdr-expert", g);
      c.style.setProperty("--coul", x.couleur);
      tete(x.id, "moyen", c);
      el("strong", "jdr-expert-nom", c, x.prenom);
      el("span", "jdr-expert-spe", c, x.specialite);
      el("span", "jdr-expert-trait", c, ty(x.trait));
    });
  };

  // La répartition des enquêtes ---------------------------------------------------------------
  BRIQUES["jdr-repartition"] = function (z) {
    var g = el("div", "jdr-repart", z);
    function dessiner() {
      g.innerHTML = "";
      ["A", "B", "C"].forEach(function (k) {
        var e = D.enquetes[k], p = POST[e.posture];
        var c = el("a", "jdr-carte jdr-enq-carte" + (S().posture === e.posture ? " sel" : ""), g);
        c.href = "#/enquete-" + k.toLowerCase();
        el("span", "jdr-enq-lettre", c, k);
        el("strong", "", c, ty(e.titre));
        el("span", "jdr-enq-qui", c, p.nom);
        var exp = el("span", "jdr-enq-exp", c);
        el("span", "", exp, "Tous les experts répondent ; un seul est le bon premier interlocuteur.");
        if (S().posture === e.posture) el("span", "jdr-enq-toi", c, "▶ ton enquête");
      });
    }
    dessiner(); abonnes.push(dessiner);
  };

  // L'enquête : le cœur du jeu -------------------------------------------------------------------
  BRIQUES["jdr-enquete"] = function (z) {
    var k = z.dataset.enquete, E = D.enquetes[k];
    if (!E) return;
    if (EN_PDF) {
      el("p", "jdr-pdf", z, "Interactif dans la version HTML. Ta mission :");
      var ol = el("ol", "jdr-mission", z); E.mission.forEach(function (m) { el("li", "", ol, ty(m)); });
      return;
    }
    var N = {}; E.noeuds.forEach(function (n) { N[n.id] = n; });
    var tete_ = el("div", "jdr-enq-tete", z);
    var qui = el("div", "jdr-enq-qui-suis", tete_);
    var conf = el("div", "", tete_);
    var scene = el("div", "jdr-enq-scene", z);
    var gauche = el("div", "jdr-enq-gauche", scene);
    el("div", "jdr-sous", gauche, "Avec qui veux-tu commencer ?");
    var portraits = el("div", "jdr-portraits", gauche);
    var boite = el("div", "jdr-dialogue grand", gauche);
    var plaque = el("div", "jdr-plaque", boite, "");
    plaque.style.visibility = "hidden";
    var texte = el("p", "jdr-texte", boite, "Clique sur un expert.");
    var choix = el("div", "jdr-choix", boite);
    var droite = el("div", "jdr-enq-droite", scene);
    var onglets = el("div", "jdr-onglets", droite);
    var panneau = el("div", "jdr-panneau", droite);
    el("div", "jdr-toasts", z);
    var actif = null, ongletActif = "mission", parleur = null;

    function posture() { return S().posture || E.posture; }
    function vu(id) { return !!S().vus[id]; }
    function dispo(n) {
      if (n.cache && !S().debloques[n.id]) return false;
      if (n.expert === E.bon && !S().accueils[k + ":" + E.bon + ":ouvert"]) return false;
      return (n.requiert || []).every(vu);
    }
    function aDire(xid) {
      // le badge ne trahit pas le bon premier interlocuteur : il ne compte que ce qui s'est ouvert
      return E.noeuds.filter(function (n) { return n.expert === xid && dispo(n) && !vu(n.id); }).length;
    }
    function appliquer(o) {
      (o.indices || []).forEach(function (i) {
        if (!S().indices[i] && D.indices[i]) { S().indices[i] = true; toast(z, "Carnet : « " + D.indices[i].titre + " »", "carnet"); }
      });
      (o.pistes || []).forEach(function (p) {
        if (!S().pistes[p]) { S().pistes[p] = true; toast(z, "Nouvelle piste : " + (D.pistes[p] ? D.pistes[p].titre : "le labo"), "piste"); }
      });
      (o.debloque || []).forEach(function (n) {
        if (!S().debloques[n]) {
          S().debloques[n] = true;
          var nn = N[n]; if (nn) toast(z, EXP[nn.expert].prenom + " a quelque chose à te dire.", "debloque");
        }
      });
      if (o.cout) { confiance(-o.cout); toast(z, "Le préfet s'impatiente : un indice de plus.", "cout"); }
    }
    function dessinerTete() {
      qui.innerHTML = "";
      var p = POST[posture()];
      tete(S().heros || "heros-1", "petit", qui);
      var t = el("div", "", qui);
      el("strong", "", t, (S().nom ? S().nom + ", " : "") + p.nom.toLowerCase());
      el("span", "", t, "Enquête " + k + " · " + ty(E.titre));
      if (posture() !== E.posture) el("span", "jdr-aide-enq", t, "Cette enquête est celle de " + POST[E.posture].nom.toLowerCase() + " : tu viens l'aider.");
      conf.innerHTML = ""; confianceHTML(conf);
    }
    function dessinerPortraits() {
      portraits.innerHTML = "";
      D.experts.forEach(function (x) {
        var b = el("button", "jdr-portrait" + (actif === x.id ? " actif" : ""), portraits); b.type = "button";
        b.style.setProperty("--coul", x.couleur);
        var t = tete(x.id, "", b);
        el("span", "jdr-portrait-nom", b, x.prenom);
        el("span", "jdr-portrait-spe", b, x.specialite);
        var n = aDire(x.id);
        if (n) el("span", "jdr-badge", b, String(n));
        b.addEventListener("click", function () { ouvrir(x.id); });
        if (actif === x.id) parleur = t;
      });
    }
    function direJoueur(texteJoueur) {
      var l = el("div", "jdr-joueur", choix);
      tete(S().heros || "heros-1", "mini", l);
      el("span", "", l, ty(texteJoueur));
    }
    function ouvrir(xid) {
      actif = xid; dessinerPortraits();
      var x = EXP[xid];
      plaque.textContent = x.prenom + " · " + x.specialite;
      plaque.style.visibility = "visible";
      plaque.style.background = x.couleur;
      choix.innerHTML = "";
      var cleA = k + ":" + xid, acc = E.accueils[xid] || { r: "…" };
      if (!S().accueils[cleA]) {
        S().accueils[cleA] = true;
        if (!acc.choix) { appliquer(acc); if (xid === E.bon) S().accueils[k + ":" + xid + ":ouvert"] = true; }
        changer();
        parler(parleur, texte, acc.r, function () {
          if (acc.choix) {
            acc.choix.forEach(function (c) {
              bouton("▶ " + c.dit, "jdr-q", choix, function () {
                choix.innerHTML = ""; direJoueur(c.dit);
                appliquer(c);
                if (c.ouvre || xid === E.bon) S().accueils[k + ":" + xid + ":ouvert"] = true;
                changer();
                parler(parleur, texte, c.r, function () { listerQuestions(xid); });
                dessinerPortraits();
              });
            });
          } else listerQuestions(xid);
        });
      } else {
        texte.textContent = ty(acc.r);
        listerQuestions(xid);
      }
    }
    function listerQuestions(xid) {
      var liste = E.noeuds.filter(function (n) { return n.expert === xid && dispo(n); });
      var nouveaux = liste.filter(function (n) { return !vu(n.id); });
      var deja = liste.filter(function (n) { return vu(n.id); });
      var zoneQ = el("div", "jdr-questions", choix);
      nouveaux.forEach(function (n) {
        bouton("▶ " + n.q + (n.cout ? "  (indice : −1 confiance)" : ""), "jdr-q" + (n.cout ? " cout" : ""), zoneQ, function () { poser(n); });
      });
      deja.forEach(function (n) { bouton("↺ " + n.q, "jdr-q vu", zoneQ, function () { poser(n, true); }); });
      if (!liste.length) {
        var autre = xid === E.bon ? "Tu as fait le tour pour l'instant." :
          "Pour cette enquête, ce n'est pas le bon premier interlocuteur. Essaie un autre expert.";
        el("p", "jdr-astuce", zoneQ, autre);
      } else if (!nouveaux.length && xid === E.bon) {
        el("p", "jdr-astuce", zoneQ, "Tu as fait le tour avec " + EXP[xid].prenom + ". Va au labo, aide tes coéquipiers, ou passe au rapport.");
      }
    }
    function poser(n, relire) {
      choix.innerHTML = "";
      direJoueur(n.q);
      // le tronc commun, puis l'angle de la posture, à la ligne : les répliques de Marc restent telles quelles
      var rep = n.r + (n.angles && n.angles[posture()] ? "\n" + n.angles[posture()] : "");
      if (!relire) { S().vus[n.id] = true; appliquer(n); changer(); }
      dessinerPortraits();
      parler(parleur, texte, rep, function () { listerQuestions(n.expert); });
    }
    function dessinerOnglets() {
      onglets.innerHTML = "";
      var nI = Object.keys(S().indices).length, nP = Object.keys(S().pistes).length;
      [["mission", "Mission"], ["pistes", "Pistes (" + nP + ")"], ["carnet", "Carnet (" + nI + ")"]].forEach(function (o) {
        bouton(o[1], "jdr-onglet" + (ongletActif === o[0] ? " sel" : ""), onglets, function () { ongletActif = o[0]; dessinerOnglets(); dessinerPanneau(); });
      });
    }
    function dessinerPanneau() {
      panneau.innerHTML = "";
      if (ongletActif === "mission") {
        var ol = el("ol", "jdr-mission", panneau);
        E.mission.forEach(function (m) { el("li", "", ol, ty(m)); });
        var site = D.pistes[E.piste];
        var l = el("div", "jdr-liens", panneau);
        var a = el("a", "jdr-btn principal", l, "Ouvrir " + site.titre); a.href = site.url; a.target = "_blank"; a.rel = "noopener";
        var s = el("a", "jdr-btn", l, "Le site ne répond pas ? Le labo"); s.href = "#/" + site.labo;
      } else if (ongletActif === "pistes") {
        var ks = Object.keys(S().pistes);
        if (!ks.length) el("p", "jdr-astuce", panneau, "Les experts t'ouvriront des pistes.");
        ks.forEach(function (p) {
          if (p.indexOf("labo-") === 0) { var a = el("a", "jdr-piste", panneau, "Le labo " + p.slice(5).toUpperCase() + " (secours intégré)"); a.href = "#/" + p; return; }
          var P = D.pistes[p]; if (!P) return;
          var b = el("a", "jdr-piste", panneau, P.titre); b.href = P.url; b.target = "_blank"; b.rel = "noopener";
        });
      } else {
        var ks2 = Object.keys(S().indices);
        if (!ks2.length) el("p", "jdr-astuce", panneau, "Ton carnet est vide : interroge les experts.");
        ks2.forEach(function (i) {
          var I = D.indices[i]; if (!I) return;
          var c = el("div", "jdr-note", panneau);
          el("strong", "", c, I.titre);
          el("span", "", c, ty(I.texte));
        });
      }
    }
    function tout() { dessinerTete(); dessinerPortraits(); dessinerOnglets(); dessinerPanneau(); }
    tout(); abonnes.push(function () { dessinerTete(); dessinerOnglets(); dessinerPanneau(); });
  };

  // Les labos de secours ---------------------------------------------------------------------------
  BRIQUES["jdr-labo"] = function (z) {
    var l = z.dataset.labo;
    if (l === "a") laboA(z); else if (l === "b") laboB(z); else if (l === "c") laboC(z);
  };
  function lecteur(parent, cles, etiquettes, titre, note, vitesse) {
    var c = el("div", "jdr-lecteur", parent);
    el("div", "jdr-sous", c, titre);
    var im = el("img", "jdr-lecteur-img", c); im.src = IMG[cles[0]]; im.alt = "";
    var bas = el("div", "jdr-lecteur-bas", c);
    var lire = bouton("▶ Lancer", "", bas);
    var r = el("input", "jdr-lecteur-curseur", bas); r.type = "range"; r.min = 0; r.max = cles.length - 1; r.value = 0;
    var lab = el("span", "jdr-lecteur-lab", bas, etiquettes[0]);
    var t = null;
    if (window.Reveal) Reveal.on("slidechanged", function () { if (t) { clearInterval(t); t = null; lire.textContent = "▶ Lancer"; } });
    function aller(i) { r.value = i; im.src = IMG[cles[i]]; lab.textContent = etiquettes[i]; }
    r.addEventListener("input", function () { aller(+r.value); });
    lire.addEventListener("click", function () {
      if (t) { clearInterval(t); t = null; lire.textContent = "▶ Lancer"; return; }
      lire.textContent = "■ Arrêter";
      t = setInterval(function () { aller((+r.value + 1) % cles.length); }, vitesse || 180);
    });
    if (note) el("p", "jdr-note-labo", c, ty(note));
    return c;
  }
  function laboA(z) {
    var g = el("div", "jdr-labo-deux", z);
    var cles = [], et = [];
    for (var k = 0; k < 37; k++) { cles.push("mtg-" + (k < 10 ? "0" : "") + k); et.push(D.meteosat_dates[k] + " UTC"); }
    lecteur(g, cles, et, "Meteosat, la séquence de secours", D.meteosat_note, 180);
    var tc = [], tl = [];
    for (var j = 21; j <= 28; j++) { tc.push("terra-" + j); tl.push(j + " juillet 2026"); }

        var ul = el("ul", "jdr-bareme", res);
        V.points.forEach(function (p) {
          var q = pts[p.id], c = q && classe(q[0], q[1]);
          var li = el("li", "", ul); el("strong", "", li, p.nom + " : ");
          if (c) el("i", "jdr-pastille", li).style.background = c[2];
          el("span", "", li, c ? c[3] : "—");
        });
        parler(ty_, tx, V.youri[1]);
      }
    }
    cv.addEventListener("click", function (e) {
      if (etape >= 0) return;
      var r = cv.getBoundingClientRect();
      pts[actifP] = [(e.clientX - r.left) / r.width * G.w, (e.clientY - r.top) / r.height * G.h];
      var reste = V.points.filter(function (p) { return !pts[p.id]; });
      if (reste.length) actifP = reste[0].id;
      changer(); dessinerChoix(); dessiner();
    });
    bouton("Effacer mes points", "discret", cote, function () { V.points.forEach(function (p) { delete pts[p.id]; }); etape = -1; res.innerHTML = ""; txt.innerHTML = ""; bas.innerHTML = ""; changer(); dessinerChoix(); dessiner(); });
    dessinerChoix(); dessiner();
  };

  // La phrase de la classe (projection) -------------------------------------------------------------
  BRIQUES["jdr-phrase"] = function (z) {
    var ph = el("div", "jdr-phrase-t", z), ligne = el("div", "", ph);
    D.phrase.forEach(function (p) {
      if (p[0] === "t") ligne.appendChild(document.createTextNode(ty(p[1])));
      else if (p[0] === "br") ligne = el("div", "jdr-phrase-l", ph);
      else if (p[0] === "b") { var s = el("span", "jdr-blanc", ligne); s.style.minWidth = p[2] + "em"; var i = el("input", "", s); i.setAttribute("aria-label", p[1]); }
      else { var r = el("span", "jdr-revele", ligne, "·····"); r.dataset.cle = p[1]; r.dataset.val = p[2]; }
    });
    var b = el("div", "jdr-choix-ligne", z);
    D.phrase.filter(function (p) { return p[0] === "r"; }).forEach(function (p) {
      bouton("Révéler " + p[1], "", b, function () { var r = z.querySelector('.jdr-revele[data-cle="' + p[1] + '"]'); r.textContent = r.dataset.val; r.classList.add("vu"); });
    });
    el("p", "jdr-note-labo", z, ty(D.phrase_note));
  };

  // Une bulle : un expert dit le texte écrit dans la diapo ------------------------------------------
  BRIQUES["jdr-bulle"] = function (z) {
    var qui = z.dataset.qui || "rose", x = EXP[qui] || { prenom: D.prefet.nom, specialite: "", couleur: "#1D2A66" };
    var parent = z.parentNode, paras = tous(":scope > p, :scope > ul, :scope > ol", parent);
    var textes = paras.map(function (p) { return p.textContent; });
    paras.forEach(function (p) { p.classList.add("jdr-cache"); });
    var sc = el("div", "jdr-scene", z);
    var t = tete(qui, "moyen", sc);
    var bo = el("div", "jdr-dialogue", sc);
    el("div", "jdr-plaque", bo, x.prenom + (x.specialite ? " · " + x.specialite : "")).style.background = x.couleur;
    var tx = el("p", "jdr-texte", bo);
    var suite = el("div", "jdr-choix", bo);
    var i = 0;
    if (EN_PDF) { tx.textContent = textes.map(ty).join(" "); return; }
    function dire() {
      suite.innerHTML = "";
      parler(t, tx, textes[i], function () {
        if (i < textes.length - 1) bouton("▶ suite", "jdr-q", suite, function () { i += 1; dire(); });
      });
    }
    tx.textContent = "▶";
    var lance = false;
    function lancer() { if (!lance) { lance = true; dire(); } }
    sc.addEventListener("click", lancer);
    if (window.Reveal) Reveal.on("slidechanged", function (e) { if (e.currentSlide.contains(z)) lancer(); });
  };

  zones.forEach(function (z) {
    stopper(z.parentNode);
    var f = BRIQUES[z.dataset.brique];
    if (f) { try { f(z); } catch (e) { el("p", "jdr-manque", z, "Erreur : " + e.message); if (window.console) console.error(e); } }
  });
})();
</script>
