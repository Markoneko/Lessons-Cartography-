<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-label="GIS vocabulary in one diagram: tables, fields, values, keys, DBMS, layers, features, coordinate system, interface">
  <rect class="s-fond" x="10" y="10" width="1100" height="430" rx="14"/>
  <a href="#/attributs"><text class="s-titre" x="40" y="48">A table</text></a>
  <!-- table -->
  <rect class="s-blanc" x="40" y="70" width="330" height="190"/>
  <rect class="s-plein" x="40" y="70" width="330" height="38" opacity="0.15"/>
  <path class="s-fin" d="M40 108 h330 M40 146 h330 M40 184 h330 M40 222 h330 M100 70 v190 M200 70 v190 M290 70 v190"/>
  <text x="70" y="96" text-anchor="middle" class="s-orange">id</text>
  <text x="150" y="96" text-anchor="middle">species</text><text x="245" y="96" text-anchor="middle">area</text><text x="330" y="96" text-anchor="middle">age</text>
  <text x="70" y="133" text-anchor="middle" class="s-orange">12</text><text x="150" y="133" text-anchor="middle">oak</text><text x="245" y="133" text-anchor="middle">4.2</text><text x="330" y="133" text-anchor="middle">85</text>
  <text x="70" y="171" text-anchor="middle" class="s-orange">13</text><text x="150" y="171" text-anchor="middle">beech</text><text x="245" y="171" text-anchor="middle">7.9</text><text x="330" y="171" text-anchor="middle">60</text>
  <text x="70" y="209" text-anchor="middle" class="s-orange">14</text><text x="150" y="209" text-anchor="middle">pine</text><text x="245" y="209" text-anchor="middle">2.6</text><text x="330" y="209" text-anchor="middle">35</text>
  <a href="#/types-valeurs"><text class="s-petit" x="245" y="282" text-anchor="middle">fields, values of different types</text></a>
  <a href="#/attributs"><text class="s-orange" x="70" y="250" text-anchor="middle">key</text></a>
  <!-- SGBD -->
  <ellipse class="s-blanc" cx="205" cy="330" rx="70" ry="14"/>
  <path class="s-blanc" d="M135 330 v55 a70 14 0 0 0 140 0 v-55"/>
  <ellipse class="s-fond" cx="205" cy="330" rx="70" ry="14"/>
  <text x="205" y="372" text-anchor="middle" class="s-titre" style="font-size:17px">DBMS</text>
  <text class="s-petit" x="205" y="420" text-anchor="middle">the system that manages the tables</text>
  <path class="s-tirets" d="M205 292 v22"/>
  <!-- lien -->
  <path class="s-accent" d="M372 127 C 500 120 600 150 715 165"/>
  <text class="s-orange" x="440" y="112">the link, through the key</text>
  <!-- couches -->
  <a href="#/couches"><text class="s-titre" x="640" y="48">Layers</text></a>
  <path class="s-fond" d="M700 300 L1000 300 L940 350 L640 350 Z" style="fill:#DCE6F5"/>
  <path class="s-fond" d="M700 225 L1000 225 L940 275 L640 275 Z"/>
  <path class="s-fond" d="M700 140 L1000 140 L940 190 L640 190 Z"/>
  <path class="s-plein-accent" opacity="0.35" d="M720 150 l70 -2 l5 30 l-80 4 z"/>
  <path class="s-trait" d="M720 150 l70 -2 l5 30 l-80 4 z"/>
  <path class="s-accent" d="M820 180 q40 -30 90 -20"/>
  <circle class="s-plein" cx="905" cy="152" r="6"/>
  <a href="#/vecteur"><text x="1010" y="170">vector</text></a>
  <a href="#/mnt"><text x="1010" y="255">DTM</text></a>
  <a href="#/raster"><text x="1010" y="330">raster</text></a>
  <a href="#/vecteur"><text class="s-petit" x="790" y="128" text-anchor="middle">features: polygon, line, point</text></a>
  <!-- coordonnées -->
  <path class="s-trait" d="M640 390 H990 M640 390 V360"/>
  <a href="#/ou-et-quoi"><text class="s-petit" x="815" y="412" text-anchor="middle">one coordinate system shared by all layers</text></a>
  <text class="s-petit" x="1100" y="432" text-anchor="end">all of it, in a software interface: QGIS</text>
</svg>
