<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="A database and a mapping system coupled by a software layer, in an absolute coordinate system">
  <!-- base de données -->
  <ellipse class="s-blanc" cx="150" cy="70" rx="110" ry="24"/>
  <path class="s-blanc" d="M40 70 v150 a110 24 0 0 0 220 0 v-150"/>
  <ellipse class="s-fond" cx="150" cy="70" rx="110" ry="24"/>
  <path class="s-fin" d="M80 115 h140 M80 145 h140 M80 175 h140 M80 205 h140 M120 115 v90 M170 115 v90"/>
  <rect class="s-plein-accent" x="80" y="115" width="40" height="30" opacity="0.35"/>
  <text class="s-titre" x="150" y="282" text-anchor="middle">Database</text>
  <text class="s-petit" x="150" y="304" text-anchor="middle">tables, fields, values</text>
  <!-- couche logicielle -->
  <path class="s-accent" d="M300 150 H690"/>
  <path class="s-plein-accent" d="M296 150 l16 -9 v18 z M694 150 l-16 -9 v18 z"/>
  <rect class="s-blanc" x="400" y="118" width="190" height="64" rx="10"/>
  <text class="s-titre" x="495" y="148" text-anchor="middle">GIS</text>
  <text class="s-petit" x="495" y="168" text-anchor="middle">the software layer</text>
  <!-- système de cartographie -->
  <path class="s-fond" d="M760 210 L960 210 L900 250 L700 250 Z"/>
  <path class="s-fond" d="M760 160 L960 160 L900 200 L700 200 Z"/>
  <path class="s-fond" d="M760 110 L960 110 L900 150 L700 150 Z"/>
  <path class="s-trait" d="M790 222 l40 6 l30 14 M770 172 q50 -6 90 20 M800 125 h40 l-10 15 h-40 z"/>
  <circle class="s-plein" cx="880" cy="125" r="5"/>
  <path class="s-trait" d="M700 270 V60 M700 270 H950"/>
  <path class="s-plein" d="M700 52 l-6 12 h12 z M958 270 l-12 -6 v12 z"/>
  <text class="s-petit" x="712" y="66">Y</text>
  <text class="s-petit" x="944" y="292">X</text>
  <text class="s-titre" x="830" y="314" text-anchor="middle">Mapping</text>
  <text class="s-petit" x="830" y="40" text-anchor="middle">layers, in a coordinate</text><text class="s-petit" x="830" y="58" text-anchor="middle">system</text>
</svg>
