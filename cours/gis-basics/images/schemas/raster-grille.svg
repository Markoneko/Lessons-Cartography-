    <text x="30" y="28" text-anchor="middle">31</text><text x="90" y="28" text-anchor="middle">34</text><text x="150" y="28" text-anchor="middle">58</text><text x="210" y="28" text-anchor="middle">60</text><text x="270" y="28" text-anchor="middle">61</text><text x="330" y="28" text-anchor="middle">63</text>
    <text x="30" y="73" text-anchor="middle">33</text><text x="90" y="73" text-anchor="middle">36</text><text x="150" y="73" text-anchor="middle">59</text><text x="210" y="73" text-anchor="middle">62</text><text x="270" y="73" text-anchor="middle">64</text><text x="330" y="73" text-anchor="middle">66</text>
    <text x="30" y="118" text-anchor="middle">57</text><text x="90" y="118" text-anchor="middle">60</text><text x="150" y="118" text-anchor="middle" style="fill:#fff;font-weight:700">142</text><text x="210" y="118" text-anchor="middle">64</text><text x="270" y="118" text-anchor="middle">65</text><text x="330" y="118" text-anchor="middle">67</text>
    <text x="30" y="163" text-anchor="middle">60</text><text x="90" y="163" text-anchor="middle">62</text><text x="150" y="163" text-anchor="middle">63</text><text x="210" y="163" text-anchor="middle">188</text><text x="270" y="163" text-anchor="middle">190</text><text x="330" y="163" text-anchor="middle">195</text>
    <text x="30" y="208" text-anchor="middle">61</text><text x="90" y="208" text-anchor="middle">63</text><text x="150" y="208" text-anchor="middle">65</text><text x="210" y="208" text-anchor="middle">191</text><text x="270" y="208" text-anchor="middle">201</text><text x="330" y="208" text-anchor="middle">204</text>
    <text x="30" y="253" text-anchor="middle">62</text><text x="90" y="253" text-anchor="middle">64</text><text x="150" y="253" text-anchor="middle">66</text><text x="210" y="253" text-anchor="middle">193</text><text x="270" y="253" text-anchor="middle">205</text><text x="330" y="253" text-anchor="middle">210</text>
