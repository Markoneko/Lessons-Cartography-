<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" role="img" aria-label="Induction, deduction, abduction">
<defs><marker id="fleche-raison" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E38226"/></marker></defs>
<rect x="10" y="6" width="236" height="164" rx="12" class="s-fond"/>
<text class="s-titre" x="128" y="38" text-anchor="middle" style="font-size:22px">Induction</text>
<text x="128" y="68" text-anchor="middle" style="font-size:15.5px;fill:#2B2B33">We observe repeated facts</text>
<text x="128" y="89" text-anchor="middle" style="font-size:15.5px;fill:#2B2B33">and draw a rule from them.</text>
<path d="M40 106 H216" stroke="#D8DAEC" stroke-width="1.5"/>
<text x="128" y="132" text-anchor="middle" style="font-size:15px;fill:#283B89;font-weight:700">Highly probable,</text>
<text x="128" y="153" text-anchor="middle" style="font-size:15px;fill:#283B89;font-weight:700">never absolutely certain.</text>
<rect x="260" y="6" width="236" height="164" rx="12" class="s-fond"/>
<text class="s-titre" x="378" y="38" text-anchor="middle" style="font-size:22px">Deduction</text>
<text x="378" y="68" text-anchor="middle" style="font-size:15.5px;fill:#2B2B33">Rules or premises</text>
<text x="378" y="89" text-anchor="middle" style="font-size:15.5px;fill:#2B2B33">lead to a conclusion.</text>
<path d="M290 106 H466" stroke="#D8DAEC" stroke-width="1.5"/>
<text x="378" y="132" text-anchor="middle" style="font-size:15px;fill:#283B89;font-weight:700">If the premises are true,</text>
<text x="378" y="153" text-anchor="middle" style="font-size:15px;fill:#283B89;font-weight:700">the conclusion is certain.</text>
<rect x="510" y="6" width="236" height="164" rx="12" class="s-fond"/>
<text class="s-titre" x="628" y="38" text-anchor="middle" style="font-size:22px">Abduction</text>
<text x="628" y="68" text-anchor="middle" style="font-size:15.5px;fill:#2B2B33">Faced with an observed fact,</text>
<text x="628" y="89" text-anchor="middle" style="font-size:15.5px;fill:#2B2B33">we put forward hypotheses.</text>
<path d="M540 106 H716" stroke="#D8DAEC" stroke-width="1.5"/>
<text x="628" y="132" text-anchor="middle" style="font-size:15px;fill:#283B89;font-weight:700">No certainty: leads,</text>
<text x="628" y="153" text-anchor="middle" style="font-size:15px;fill:#283B89;font-weight:700">above all when the fact surprises.</text>
<text class="s-titre" x="380" y="204" text-anchor="middle">The bundle of clues</text>
<text class="s-petit" x="128" y="232" text-anchor="middle" style="font-size:14.5px;font-style:italic">Every shadow seen so far</text>
<text class="s-petit" x="128" y="251" text-anchor="middle" style="font-size:14.5px;font-style:italic">points north-west.</text>
<circle cx="128" cy="266" r="5" fill="#E38226"/>
<path d="M128 270 Q 203.6 292 334.64 304" fill="none" stroke="#E38226" stroke-width="3" marker-end="url(#fleche-raison)"/>
<text class="s-petit" x="378" y="232" text-anchor="middle" style="font-size:14.5px;font-style:italic">The sun is in the south-east:</text>
<text class="s-petit" x="378" y="251" text-anchor="middle" style="font-size:14.5px;font-style:italic">shadows fall north-west.</text>
<circle cx="378" cy="266" r="5" fill="#E38226"/>
<path d="M378 270 Q 378.6 292 379.64 304" fill="none" stroke="#E38226" stroke-width="3" marker-end="url(#fleche-raison)"/>
<text class="s-petit" x="628" y="232" text-anchor="middle" style="font-size:14.5px;font-style:italic">A long dark patch</text>
<text class="s-petit" x="628" y="251" text-anchor="middle" style="font-size:14.5px;font-style:italic">at the foot of a tower…</text>
<circle cx="628" cy="266" r="5" fill="#E38226"/>
<path d="M628 270 Q 553.6 292 424.64 304" fill="none" stroke="#E38226" stroke-width="3" marker-end="url(#fleche-raison)"/>
<rect x="220" y="306" width="320" height="44" rx="22" fill="#283B89"/>
<text x="380" y="335" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#FFFFFF">hypothesis: it is the tower’s shadow</text>
</svg>
