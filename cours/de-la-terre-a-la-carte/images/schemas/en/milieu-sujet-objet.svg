<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Every map links an environment, a subject who looks and an object that is shown">
  <path class="s-fin" d="M320 78 L112 300 L528 300 Z"/>
  <circle class="s-fond" cx="320" cy="226" r="54"/>
  <text class="s-titre" x="320" y="222" text-anchor="middle">The map</text>
  <text class="s-petit" x="320" y="244" text-anchor="middle">a choice</text>
  <circle class="s-plein" cx="320" cy="78" r="9"/>
  <text class="s-titre" x="320" y="42" text-anchor="middle">The environment</text>
  <text class="s-petit" x="320" y="62" text-anchor="middle">the world as it is</text>
  <circle class="s-plein-accent" cx="112" cy="300" r="9"/>
  <text class="s-titre" x="112" y="338" text-anchor="middle">The subject</text>
  <text class="s-petit" x="112" y="358" text-anchor="middle">the one who looks</text>
  <circle class="s-plein" cx="528" cy="300" r="9"/>
  <text class="s-titre" x="528" y="338" text-anchor="middle">The object</text>
  <text class="s-petit" x="528" y="358" text-anchor="middle">what is shown</text>
</svg>
